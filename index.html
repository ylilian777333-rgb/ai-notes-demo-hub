<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Lilian · Demo 管理中心</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f8fafc;--s2:#ffffff;--s3:#f1f5f9;
  --bd:#e2e8f0;--bd2:#cbd5e1;
  --tx:#0f172a;--su:#475569;--mu:#64748b;--dm:#94a3b8;
  --bl:#2563eb;--am:#d97706;--pu:#7c3aed;--gn:#16a34a;--rd:#dc2626;--cy:#0891b2;
}
html,body{background:var(--bg);color:var(--tx);font-family:'Noto Sans SC',sans-serif;min-height:100vh}
body{padding:32px 24px 60px}
.container{max-width:1200px;margin:0 auto}

/* header */
.header{text-align:center;margin-bottom:40px}
.header-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.03);border:1px solid var(--bd);border-radius:20px;padding:4px 14px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu);margin-bottom:12px}
.header h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.header p{font-size:13px;color:var(--mu)}
.stats{display:flex;gap:20px;justify-content:center;margin-top:16px}
.stat{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:8px 18px;text-align:center}
.stat-num{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--bl)}
.stat-label{font-size:10px;color:var(--mu);margin-top:2px}

/* filters */
.filters{display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap;justify-content:center}
.filter-btn{display:flex;align-items:center;gap:6px;border:1.5px solid var(--bd);border-radius:10px;padding:8px 16px;cursor:pointer;transition:all .25s;background:var(--s2);font-family:'Noto Sans SC',sans-serif;font-size:12px;font-weight:500;color:var(--su)}
.filter-btn:hover{border-color:var(--bd2);transform:translateY(-1px);background:var(--s3)}
.filter-btn.active{border-color:var(--bl);background:rgba(37,99,235,.08);color:var(--bl)}
.filter-btn .count{font-family:'JetBrains Mono',monospace;font-size:10px;background:rgba(0,0,0,.05);padding:2px 6px;border-radius:4px;color:var(--mu)}

/* timeline */
.timeline{position:relative;padding-left:28px}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,var(--bd),transparent)}
.date-group{margin-bottom:32px}
.date-label{position:relative;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mu);margin-bottom:14px;letter-spacing:.05em}
.date-label::before{content:'';position:absolute;left:-24px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--bl);border:2px solid var(--bg);box-shadow:0 0 6px rgba(37,99,235,.25)}

/* cards grid */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}

/* card */
.card{display:block;background:var(--s2);border:1px solid var(--bd);border-radius:14px;padding:16px 18px;text-decoration:none;color:var(--tx);transition:all .25s;position:relative;overflow:hidden;cursor:pointer}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac);border-radius:3px 0 0 3px;opacity:.6;transition:opacity .25s}
.card:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.08)}
.card:hover::before{opacity:1}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.card-ver{font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 8px;border-radius:5px;background:rgba(0,0,0,.04);color:var(--ac);font-weight:600}
.card-time{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dm)}
.card-title{font-size:14px;font-weight:600;margin-bottom:5px;line-height:1.4}
.card-desc{font-size:11.5px;color:var(--mu);line-height:1.6;margin-bottom:10px}
.card-foot{display:flex;justify-content:space-between;align-items:center}
.card-cat{font-size:10px;padding:3px 8px;border-radius:5px;background:rgba(0,0,0,.04);color:var(--su);font-weight:500}
.card-open{font-size:11px;color:var(--ac);font-weight:500;opacity:0;transition:opacity .25s}
.card:hover .card-open{opacity:1}

/* responsive */
@media(max-width:640px){
  body{padding:20px 14px 40px}
  .header h1{font-size:22px}
  .cards{grid-template-columns:1fr}
  .stats{gap:10px}
  .stat{padding:6px 12px}
}
</style>
</head>
<body>

      <div class="stat"><div class="stat-num" id="statDays">0</div><div class="stat-label">活跃天数</div></div>

  <div class="filters" id="filters"></div>
  <div id="timeline"></div>
</div>

  {file:"demos/notes-os5-third-party-leverage.html",title:"笔记×三方生态·OS核心发力点(VP视角讨论稿)",desc:"站在整个OS层面讨论：AI时代系统拼谁最懂用户、最迁不走，靠用户主动攒的高价值内容(会议/攻略/资料/想法)，但这批内容大半散在三方App里、锁着、找不回。笔记的机会=当三方生态的总收口+总出口。三发力点：①接进来(跨App一键存,全网收藏收口,核心)②接出去(笔记喂三方Agent照用户攻略/清单办事,如携程美团淘宝,核心)③消化(三方长内容存进来AI嚼碎,补充)。含只有OS能做的理由+风险(接口合作/版权隐私/授权可撤回)。浅色墨绿专业风。",cat:"product",catName:"产品定义",color:"gn",date:"2026-07-17",time:"11:00",ver:"VP战略讨论稿"},
  {file:"demos/notes-ai-meeting-scene.html",title:"小米笔记·开会明星场景(发布会方案B)",desc:"发布会用·明星场景串演版：用一个开会场景把AI笔记讲完——①开会中手机放着自动记(边听边转写分说话人)②散会后纪要与待办就位(重点结论谁做什么)③过几天一句话问回结论(带原文出处)。左大手机占位+右侧场景推进文案+用户旁白，黑底16:9。与方案A(notes-ai-launch)能力总览版对比。",cat:"ppt",catName:"PPT演示",color:"pu",date:"2026-07-16",time:"20:00",ver:"发布会方案B"},
  {file:"demos/notes-ai-launch.html",title:"小米笔记·AI应用发布会Demo",desc:"发布会用·只讲笔记这一块的AI能力。3页16:9黑底：①能力总览(找得到/理得清/写得出/改得好，各配一句用户口令)②明星场景开会(边开会边记→自动成纪要待办→一句话问回结论)③伴随写作三时刻(还没写帮你开始/写一半帮你写下去/选中一段帮你改好)。不含小爱生态总览页。",cat:"ppt",catName:"PPT演示",color:"pu",date:"2026-07-16",time:"18:00",ver:"发布会方案"},
  {file:"demos/notes-os5-product-plan-owner.html",title:"笔记OS5·产品规划(业务负责人对比版)",desc:"以小米笔记业务负责人视角重写的对比稿。战略判断先行(系统级agent时代笔记同时做好两件事:对用户=愿意长期把重要内容交给它也回来把事做完的地方,对生态=为整个系统提供高质量可调用个人内容;一句话=存进笔记以后一定用得上)→OS4现状(四个缺口)→定位(个人内容库)+断言否定(不是又加功能是串成用得上)→这版赢什么(敢宣示重心:②笔记内产出工作台+④内容被生态调用为主攻(差异化),①③为地基)→四件事(标地基/主攻)→北极星(内容回捞率)+两个头号风险(④依赖系统那端/③自动聚合准确率)→基础体验与PAD配套。深色战略帽子+墨绿主色。",cat:"product",catName:"产品定义",color:"gn",date:"2026-07-09",time:"10:00",ver:"业务负责人对比版"},
  {file:"demos/notes-os5-product-plan.html",title:"笔记OS5·产品规划(你自己的个人内容库)",desc:"给李楠的OS5产品规划(现代克制风,纯白底墨绿主色)。一句话结论:OS5就做一件事——把笔记做成能被调起来干活的个人数据库。A点(OS4做到能记/能生成/能问,但都卡在单篇散着)→定位(笔记=你自己的个人数据库,一句话agent调起整个库替你找写办,对OS开放谁都能调)→怎么做(补上A点差的三步:理成能调用的库/agent对整库调用/对OS开放,各带from-to和装修/项目周会/体检例子)→基础体验跟大盘专项走→PAD手写学习办公。",cat:"product",catName:"产品定义",color:"gn",date:"2026-07-08",time:"12:00",ver:"产品规划HTML"},
  {file:"demos/meeting-scenes-index.html",title:"AI语音会议场景·6场景总览",desc:"AI语音/会议记录手机端完整流程,6个场景iframe并排:语音记录列表→录音中(实时转写波形)→转写详情(说话人分离)→AI总结(主题/要点/待办)→AI智能助手对话→分享导出。393x852手机画幅,飞书蓝#3370FF,MiSans",cat:"interaction",catName:"交互演示",color:"bl",date:"2026-07-01",time:"09:00",ver:"会议场景总览"},
  {file:"demos/notes-os5-definition-scenarios.html",title:"笔记OS5·产品定义→明星场景",desc:"Light模式+左侧目录+绿色主色。先立产品定义(笔记=你主动沉淀/看得见改得动/有价值内容的数据库;你决定存什么·AI帮你理好自动关联随时问·会主动找你;做什么/不做什么),再讲产品方向(在今年基础上把三件事做得更好:随手就能记/AI自动理好连起来/被小爱调用主动找你),最后基于定义讲5个明星场景(开会散会即得/上课一份内容看听练/看病个人健康档案/出行玩完即成完整攻略笔记/随身灵感攒成初稿),每个配跨端设备链路占位图。全篇只讲笔记不定义OS不提竞品",cat:"product",catName:"产品定义",color:"gn",date:"2026-07-02",time:"14:00",ver:"定义→场景 v2"},
  {file:"demos/q2-product-innovation-award-deck.html",title:"Q2产品创新奖·申报Deck(22页)",desc:"AI语音笔记Q2产品创新奖申报幻灯片。主线:用户痛点→竞品市场→产品定义(定义正推/排除法)→定位重构(改版前后对比)→四范式→场景显化(会议/问诊)→生态接入(输入侧多端汇聚/输出侧MiClaw调用)→交付创新(1月420beta/3月完整版/系统应用高频日更)→用户价值→方法论三资产(AI原生定义/系统生态接入/AIcoding敏捷交付)→接下来方向→团队分工。定位主线:语音速记入口→AI加工中枢→个人数据库沉淀→MiClaw调用放大。橙#F2660A/蓝/黑,MiSans,16:9",cat:"ppt",catName:"PPT演示",color:"pu",date:"2026-07-01",time:"10:00",ver:"申报Deck v2"},
  {file:"demos/notes-os5-direction-plan.html",title:"笔记OS5·方向规划(笔记=小爱懂你的个人内容层)",desc:"PM判断稿。回答'笔记OS5该往哪做':OS5重心=把小爱做成全生态系统级Agent,它要真懂你缺的是用户认可/看得见的个人内容,这层就是笔记。站位:小爱=入口大脑,笔记=个人内容层(一个飞轮两半)。四环承接(写得出小爱起手/收得进接小爱产出/用得上供小爱调用RAG/自己长越用越懂);真正硬骨头=笔记↔小爱内容调用接口契约(读什么/怎么读/怎么授权);边界(不做黑盒画像/不默认全收);节奏(接口+用得上压头部资源)。结论先行+金句+表格,塔玉深色风",cat:"product",catName:"产品定义",color:"gn",date:"2026-06-30",time:"15:00",ver:"方向判断稿"},
  {file:"demos/notes-os5-cross-device-scenarios.html",title:"笔记OS5·生态粘性 AI生产力跨端明星场景",desc:"承接软件部OS5规划生态粘性→AI生产力体验。笔记=随身个人数据库,5个跨端明星场景串联:开会办公(手机桌上录→自动纪要待办→一句话生成汇报→手表提醒→车机听要点)/上课学习(平板手写录音→复习大纲→耳机听播客→手机做题)/看病陪诊(录医嘱拍报告→健康档案→手表提醒吃药→复诊调出)/出行旅游(攻略机酒成行程→随手拍随手记→一键成游记)/随身灵感(车机/手表/耳机随口说→攒成初稿)。只写跨端场景不写能力,横排设备帧串联",cat:"product",catName:"产品定义",color:"gn",date:"2026-06-29",time:"22:00",ver:"跨端明星场景"},
  {file:"demos/notes-definition-2026.html",title:"笔记·生态定位·OS5",desc:"站在小米全生态/李楠视角的笔记定位:笔记不是一个App,是用户主动沉淀的个人内容的统一承接处,让全生态AI都用得上你认可的内容(和系统侧的偏好/行为理解互补不替代)。三层定位(对用户随身知识库/对MiClaw可调用的个人内容/对生态个人内容承接处)+是什么不是什么+三个根本变化(说而非敲/全生态而非单端/被调用而非只存)+内容流动(设备→笔记→全生态AI)+四能力飞轮+差异化(vs通用AI/传统笔记/黑盒记忆)+定位锚点。先定位后需求,带左侧目录",cat:"product",catName:"产品定义",color:"gn",date:"2026-06-25",time:"10:00",ver:"定义对齐稿"},

const CATS = [
  {id:"all",name:"全部",icon:"📋",count:DEMOS.length},
  {id:"interaction",name:"交互演示",icon:"🎯",count:DEMOS.filter(d=>d.cat==="interaction").length,color:"bl"},
  {id:"product",name:"产品定义",icon:"📐",count:DEMOS.filter(d=>d.cat==="product").length,color:"am"},
  {id:"serious",name:"严肃创作",icon:"✍️",count:DEMOS.filter(d=>d.cat==="serious").length,color:"pu"},
  {id:"combined",name:"完整版",icon:"📦",count:DEMOS.filter(d=>d.cat==="combined").length,color:"gn"},
  {id:"claw",name:"Claw光线",icon:"✨",count:DEMOS.filter(d=>d.cat==="claw").length,color:"cy"},
  {id:"ppt",name:"PPT演示",icon:"📊",count:DEMOS.filter(d=>d.cat==="ppt").length,color:"pu"},
];

let activeCat = "all";

function renderFilters(){
  const el = document.getElementById("filters");
  el.innerHTML = CATS.map(c=>`<button class="filter-btn ${activeCat===c.id?'active':''}" onclick="setFilter('${c.id}')">${c.icon} ${c.name} <span class="count">${c.count}</span></button>`).join("");
}

function setFilter(cat){
  activeCat = cat;
  renderFilters();
  renderTimeline();
}

function renderTimeline(){
  const filtered = activeCat==="all" ? DEMOS : DEMOS.filter(d=>d.cat===activeCat);
  const groups = {};
  filtered.forEach(d=>{
    if(!groups[d.date]) groups[d.date]=[];
    groups[d.date].push(d);
  });
  const sortedDates = Object.keys(groups).sort((a,b)=>b.localeCompare(a));
  const el = document.getElementById("timeline");
  el.innerHTML = sortedDates.map(date=>{
    const dayLabel = formatDate(date);
    const cards = groups[date].sort((a,b)=>b.time.localeCompare(a.time));
    return `<div class="date-group">
      <div class="date-label">${dayLabel} · ${cards.length} 个版本</div>
      <div class="cards">${cards.map(renderCard).join("")}</div>
    </div>`;
  }).join("");
}

function formatDate(d){
  const [y,m,day] = d.split("-");
  const weekdays=["日","一","二","三","四","五","六"];
  const dt = new Date(d);
  return `${y}年${+m}月${+day}日 · 周${weekdays[dt.getDay()]}`;
}

function renderCard(d){
  return `<a href="${d.file}" target="_blank" class="card" style="--ac:var(--${d.color})">
    <div class="card-head">
      <span class="card-ver">${d.ver}</span>
      <span class="card-time">${d.time}</span>
    </div>
    <div class="card-title">${d.title}</div>
    <div class="card-desc">${d.desc}</div>
    <div class="card-foot">
      <span class="card-cat">${d.catName}</span>
      <span class="card-open">打开 →</span>
    </div>
  </a>`;
}

function renderStats(){
  document.getElementById("statDemos").textContent = DEMOS.length;
  document.getElementById("statCats").textContent = new Set(DEMOS.map(d=>d.cat)).size;
  document.getElementById("statDays").textContent = new Set(DEMOS.map(d=>d.date)).size;
}
renderStats();
renderFilters();
renderTimeline();
</script>
