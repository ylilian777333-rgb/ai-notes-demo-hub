let cur=0, step=0;
function render(){
  const s=scenarios[cur];
  document.getElementById('info').innerHTML=`<h2>${s.title}</h2><p>${s.desc}</p>`;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===cur));
  step=0;
  showStep();
}
function showStep(){
  const s=scenarios[cur];
  const sc=s.screens[step];
  const ph=document.getElementById('phone');
  ph.querySelectorAll('.page').forEach(p=>{p.classList.remove('active');p.classList.add('out-left');setTimeout(()=>p.remove(),350)});
  const pg=document.createElement('div');pg.className='page out-right';pg.innerHTML=sc.html;ph.appendChild(pg);
  requestAnimationFrame(()=>{pg.classList.remove('out-right');pg.classList.add('active')});
  document.getElementById('dots').innerHTML=s.screens.map((_,i)=>`<div class="dot ${i===step?'active':''}"></div>`).join('');
  document.getElementById('label').innerHTML=`<h3>${sc.name}</h3><p>${sc.sub}</p>`;
  document.getElementById('prevBtn').classList.toggle('off',step===0);
  document.getElementById('nextBtn').classList.toggle('off',step===s.screens.length-1);
}
function next(){const s=scenarios[cur];if(step<s.screens.length-1){step++;showStep()}}
function prev(){if(step>0){step--;showStep()}}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{cur=+t.dataset.i;render()}));
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});
render();
</script>
