<!doctype html>
<html lang="zh-CN">
<head>
  <!-- Migrated from ChatGPT Sites on 2026-09-15; maintained in GitHub Demo Hub. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f3f3">
  <meta name="description" content="OS5 笔记交互原型：笔记、合集、课程、待办、想法、访谈与卡证票据。">
  <title>OS5 笔记 · 交互原型</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ffbc00'/%3E%3Cpath d='M10 9h13M10 16h10M10 23h7' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="details.css">
  <link rel="stylesheet" href="interaction.css">
  <link rel="stylesheet" href="assets/os5-konsta-scenes.css">
</head>
<body>
  <aside class="studio-sidebar" aria-label="演示页面导航">
    <div class="studio-brand"><span class="brand-icon"></span><span>OS5 NOTES</span></div>
    <h1>笔记，重新开始。</h1><p class="studio-subtitle">原型交互演示</p>
    <nav class="scene-nav">
      <button data-go="notes"><span>01</span>笔记</button><button data-go="home"><span>02</span>合集</button><button data-go="course"><span>03</span>高等数学</button><button data-go="tasks"><span>04</span>待办</button><button data-go="ideas"><span>05</span>职业方向思考</button><button data-go="interview"><span>06</span>扫地机用户访谈</button><button data-go="cards"><span>07</span>卡证票据</button>
    </nav>
    <div class="studio-options"><button data-action="compare" id="compare-button" aria-pressed="false">对照原型 <span>↗</span></button><button data-action="layout" id="layout-button" aria-pressed="false">查看完整页面 <span>↕</span></button></div>
    <div class="studio-footer"><p>示例内容 · 可点击体验<br>AI 回答与系统联动为演示</p><button data-action="about">演示说明</button><span>·</span><button data-action="reset">重置</button></div>
  </aside>
  <div class="preview-area">
    <div class="preview-caption"><span id="preview-name">笔记</span><span>交互预览</span></div>
    <div class="preview-pair">
      <div class="phone" id="phone">
        <div class="statusbar" aria-hidden="true"><b>2:36</b><div id="status-icons"></div></div>
        <main id="app" tabindex="-1" aria-label="笔记应用"></main>
        <div class="bottom-fade" id="bottom-fade"></div><nav class="floating-bar" id="floating-bar" aria-label="应用操作"></nav><div class="home-indicator" aria-hidden="true"></div>
        <div class="modal-layer" id="modal-layer" hidden><div class="modal-scrim" data-action="close"></div><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"><div class="sheet-handle" aria-hidden="true"></div><header class="sheet-header"><h2 id="sheet-title"></h2><button class="icon-button" data-action="close" aria-label="关闭">×</button></header><div id="sheet-body" class="sheet-body"></div></section></div>
        <div id="toast" role="status" aria-live="polite"></div>
      </div>
      <figure class="reference-panel" id="reference-panel" hidden><figcaption>你的原型 · 原图</figcaption><img id="reference-image" alt="当前页面的设计原型"></figure>
    </div>
    <p class="preview-footnote">点击卡片进入合集，滚动查看完整内容</p>
  </div>
  <script src="icons.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="interactions.js"></script>
  <script src="assets/os5-konsta-scenes.js"></script>
  <script src="events.js"></script>
</body>
</html>
