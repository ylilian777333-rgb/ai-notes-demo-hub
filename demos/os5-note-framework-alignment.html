<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OS5 笔记 · 12 个痛点与各自的交互链路</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"MiSans","PingFang SC",-apple-system,sans-serif;background:#fff;color:#1B2033;-webkit-font-smoothing:antialiased}
.wrap{max-width:1440px;margin:0 auto;padding:0 100px}

/* ---------- 头 ---------- */
.hero{padding:64px 0 40px}
.hero .eyebrow{font-size:12px;letter-spacing:.18em;color:#2E5BFF;font-weight:600;margin-bottom:14px}
.hero h1{font-size:40px;font-weight:700;letter-spacing:-.5px;line-height:1.2}
.hero .lead{margin-top:16px;font-size:15px;line-height:1.85;color:#4A5468;max-width:880px}
.idx{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:32px}
.idx .col{border:1px solid #E4E7EF;border-radius:12px;padding:16px 18px;background:#FAFBFD}
.idx .col b{display:block;font-size:13px;margin-bottom:10px}
.idx .col p{font-size:12.5px;line-height:2;color:#4A5468}
.idx .col em{font-style:normal;color:#2E5BFF;font-weight:600;margin-right:5px}
.hero .meta{margin-top:26px;font-size:12px;color:#98A0B2}

/* ---------- 章 ---------- */
.sec{padding:56px 0;border-top:1px solid #E4E7EF}
.sec-top{display:flex;gap:22px;align-items:flex-start;margin-bottom:8px}
.snum{font-size:34px;font-weight:700;color:#C9D3F5;line-height:1;padding-top:4px;min-width:44px}
.sec h2{font-size:26px;font-weight:700;letter-spacing:-.3px}
.st-note{margin-top:10px;font-size:14px;line-height:1.85;color:#4A5468;max-width:900px}
.goal{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
.goal span{font-size:12px;padding:5px 11px;border-radius:6px;background:#F0F4FF;color:#2E5BFF;font-weight:500}
.goal span.m{background:#F5F6F8;color:#6B7280}

/* ---------- 痛点块 ---------- */
.pain{margin-top:40px;padding-top:28px;border-top:1px dashed #E4E7EF}
.pain:first-of-type{border-top:0}
.pid{font-size:12px;font-weight:700;color:#98A0B2;letter-spacing:.06em}
.lb{font-size:11px;font-weight:600;letter-spacing:.08em;margin-bottom:6px}
.lb.a{color:#C6392F}
.lb.b{color:#8A93A6}
.lb.c{color:#0F7A5A}
.pain h3{font-size:19px;font-weight:700;margin-bottom:8px;line-height:1.45}
.pain .ph{font-size:13.5px;line-height:1.9;color:#4A5468;max-width:900px}
.need{margin-top:16px;background:#F6F7FA;border-radius:10px;padding:14px 18px}
.need h4{font-size:14.5px;font-weight:600;color:#2A3245}
.sol{margin-top:12px;background:#F3FBF7;border-left:3px solid #35C08B;border-radius:0 10px 10px 0;padding:14px 18px}
.sol h4{font-size:14.5px;font-weight:600;margin-bottom:8px}
.sol ul{list-style:none}
.sol li{font-size:13px;line-height:1.95;color:#3C4658;padding-left:13px;position:relative}
.sol li:before{content:"";position:absolute;left:0;top:9.5px;width:4px;height:4px;border-radius:50%;background:#8FD9BE}
.sol .dep{margin-top:10px;padding-top:9px;border-top:1px dashed #CFEADF;font-size:11.5px;color:#7E8898}
.sol .dep b{color:#4A5468;font-weight:600;margin-right:6px}

/* ---------- 链路 ---------- */
.chain{margin-top:22px;background:#FAFBFD;border:1px solid #EBEEF4;border-radius:14px;padding:20px 20px 16px}
.chain .ch-t{font-size:12.5px;font-weight:600;color:#2A3245;margin-bottom:4px}
.chain .ch-f{font-size:12px;color:#8A93A6;margin-bottom:16px}
.rail{display:flex;align-items:flex-start;gap:0}
.step{width:236px;flex:0 0 236px}
.arrow{flex:1 1 auto;min-width:22px;text-align:center;color:#C3CAD8;font-size:17px;padding-top:250px}
.step .sh{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.step .sn{font-size:10px;font-weight:700;color:#fff;background:#B9C2D4;border-radius:4px;padding:2px 5px}
.step .stt{font-size:12px;font-weight:600}
.step .tg{font-size:10px;padding:2px 6px;border-radius:4px;background:#EEF1F7;color:#6B7280;font-weight:500}
.step .tg.us{background:#E7EDFF;color:#2E5BFF}
.step .cap{margin-top:9px;font-size:11.5px;line-height:1.75;color:#7E8898}

/* ---------- 手机屏 ---------- */
.ph-f{width:236px;height:512px;background:#F4F5F7;border:1px solid #DFE3EB;border-radius:22px;overflow:hidden;position:relative;font-size:10px;color:#1B2033}
.ph-f.w{background:#fff}
.sb{height:20px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:8.5px;color:#6B7280}
.nb{height:26px;display:flex;align-items:center;padding:0 10px;gap:6px}
.nb .bk{font-size:11px;color:#4A5468}
.nb .nt{font-size:12.5px;font-weight:600;flex:1}
.nb .ri{font-size:9px;color:#8A93A6}
.sr{margin:2px 10px 6px;height:22px;border-radius:11px;background:#EDEFF4;display:flex;align-items:center;padding:0 9px;justify-content:space-between;font-size:9px;color:#98A0B2}
.sr .ai{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,#3D5BFD,#9289FF)}
.bd{padding:0 10px}
.cats{display:flex;gap:7px}
.cc{flex:1;background:#fff;border-radius:11px;padding:9px;min-height:104px;border:1px solid #EDEFF4}
.cc .ct{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.cc .ct b{font-size:11px}
.cc .ct i{font-style:normal;font-size:8.5px;color:#98A0B2}
.cc .ci{display:flex;align-items:center;gap:5px;margin-bottom:5px}
.cc .ci .box{width:8px;height:8px;border:1px solid #C3CAD8;border-radius:2px;flex:0 0 8px}
.cc .ci .box.on{background:#2E5BFF;border-color:#2E5BFF}
.cc .ci span{font-size:9px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc .ci em{font-style:normal;font-size:8px;color:#98A0B2}
.cc .cl{display:flex;justify-content:space-between;font-size:9px;margin-bottom:6px;color:#3C4658}
.cc .cl em{font-style:normal;font-size:8px;color:#98A0B2}
.wc{background:#fff;border:1px solid #EDEFF4;border-radius:11px;padding:9px;margin-bottom:7px}
.tiles{display:flex;gap:6px}
.tile{flex:1;height:72px;background:#F4F6FA;border-radius:8px;padding:7px;display:flex;flex-direction:column;justify-content:space-between}
.tile b{font-size:8.5px;font-weight:600;line-height:1.3}
.tile em{font-style:normal;font-size:7.5px;color:#98A0B2}
.cloud{height:88px;position:relative;background:#FBFBFD;border-radius:8px;overflow:hidden}
.cloud span{position:absolute;font-size:8px;color:#6B7280;white-space:nowrap}
.cloud span.b{font-size:10px;color:#2A3245;font-weight:600}
.wal{position:relative;height:78px}
.wal div{position:absolute;left:0;right:0;height:24px;border-radius:5px;padding:4px 7px;font-size:8px;color:#3C4658}
.card{background:#fff;border:1px solid #EDEFF4;border-radius:10px;padding:9px;margin-bottom:7px}
.card .ch{font-size:11px;font-weight:600;margin-bottom:2px}
.card .cs{font-size:8.5px;color:#98A0B2;margin-bottom:6px}
.card .kv{display:flex;justify-content:space-between;font-size:9px;padding:3px 0;border-top:1px solid #F2F4F8}
.card .kv:first-of-type{border-top:0}
.card .kv i{font-style:normal;color:#98A0B2}
.qt{background:#F4F6FA;border-radius:7px;padding:7px 8px;font-size:9px;line-height:1.6;color:#3C4658;margin-bottom:7px}
.qt.hl{background:#FFF6E3;border-left:2px solid #FFB21D}
.sec-l{font-size:9px;color:#98A0B2;margin:8px 0 5px}
.li{background:#fff;border:1px solid #EDEFF4;border-radius:9px;padding:8px 9px;margin-bottom:5px}
.li b{font-size:10px;font-weight:600;display:block;margin-bottom:2px}
.li p{font-size:8.5px;line-height:1.6;color:#8A93A6}
.li em{font-style:normal;font-size:8px;color:#B0B7C5;display:block;margin-top:3px}
.trow{display:flex;align-items:center;gap:6px;padding:6px 2px;border-bottom:1px solid #F2F4F8}
.trow .box{width:9px;height:9px;border:1.2px solid #C3CAD8;border-radius:2px;flex:0 0 9px}
.trow .box.on{background:#2E5BFF;border-color:#2E5BFF}
.trow .tx{flex:1;font-size:9.5px}
.trow .tx s{text-decoration:none;color:#B0B7C5}
.trow .tx i{font-style:normal;display:block;font-size:8px;color:#B0B7C5;margin-top:1px}
.trow .mt{font-size:8px;color:#98A0B2;flex:0 0 auto}
.trow .mt.o{color:#E0803A;font-weight:600}
.btns{display:flex;gap:6px;margin:8px 0}
.btns b{flex:1;text-align:center;font-size:9.5px;font-weight:500;padding:7px 0;border-radius:7px;background:#F0F2F6;color:#4A5468}
.btns b.p{background:#2E5BFF;color:#fff}
.chips{display:flex;gap:5px;margin:6px 0 8px;flex-wrap:wrap}
.chips b{font-size:9px;font-weight:500;padding:4px 9px;border-radius:12px;background:#F0F2F6;color:#6B7280}
.chips b.on{background:#2E5BFF;color:#fff}
.tabs{display:flex;gap:12px;padding:0 2px 6px;border-bottom:1px solid #EDEFF4;margin-bottom:7px}
.tabs b{font-size:10px;color:#98A0B2;font-weight:500;padding-bottom:4px}
.tabs b.on{color:#1B2033;border-bottom:1.5px solid #2E5BFF}
.bub{max-width:88%;font-size:9px;line-height:1.65;padding:7px 9px;border-radius:9px;margin-bottom:6px;background:#fff;border:1px solid #EDEFF4}
.bub.me{background:#2E5BFF;color:#fff;margin-left:auto;border:0}
.mount{display:inline-block;font-size:8.5px;padding:3px 8px;border-radius:10px;background:#E7EDFF;color:#2E5BFF;font-weight:600;margin-bottom:6px}
.wave{display:flex;align-items:flex-end;gap:1.5px;height:30px;margin:8px 0}
.wave i{flex:1;background:#C7D3F7;border-radius:1px}
.rec{display:flex;align-items:center;gap:5px;font-size:9px;color:#C6392F;font-weight:600;margin-bottom:2px}
.rec u{width:5px;height:5px;border-radius:50%;background:#C6392F;text-decoration:none}
.notif{background:rgba(255,255,255,.92);border-radius:11px;padding:8px 9px;margin-bottom:6px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.notif .na{font-size:8px;color:#98A0B2;margin-bottom:2px}
.notif b{font-size:10px;display:block;margin-bottom:2px}
.notif p{font-size:8.5px;line-height:1.55;color:#6B7280}
.lock{position:absolute;inset:0;background:linear-gradient(160deg,#DDE4F5,#EEF1F8 60%,#F6F7FA);padding:36px 10px 0}
.lock .tm{text-align:center;font-size:26px;font-weight:600;color:#3C4658;letter-spacing:-.5px}
.lock .dt{text-align:center;font-size:9px;color:#8A93A6;margin-bottom:16px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:14px 14px 0 0;padding:11px 11px 14px;box-shadow:0 -2px 12px rgba(0,0,0,.07)}
.sheet .sht{font-size:11px;font-weight:600;margin-bottom:7px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:9px}
.grid4 i{font-style:normal;font-size:7.5px;color:#6B7280;text-align:center}
.grid4 i u{display:block;height:26px;background:#F0F2F6;border-radius:7px;margin-bottom:3px;text-decoration:none}
.ov{position:absolute;inset:0;background:rgba(27,32,51,.28);display:flex;align-items:flex-end}
.tb{position:absolute;left:0;right:0;bottom:0;height:34px;background:rgba(255,255,255,.95);border-top:1px solid #EDEFF4;display:flex;align-items:center;justify-content:space-around;padding:0 14px}
.tb span{font-size:9px;color:#98A0B2}
.tb span.on{color:#1B2033;font-weight:600}
.tb u{width:19px;height:19px;border-radius:50%;background:#1B2033;text-decoration:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px}
.tb u.o{background:#fff;border:1.2px solid #1B2033;color:#1B2033}
.pad{height:38px}
.bar{position:absolute;left:50%;transform:translateX(-50%);bottom:4px;width:70px;height:3px;border-radius:2px;background:#C3CAD8}
.ftxt{font-size:9px;color:#98A0B2;text-align:center;padding:6px 0}
.prog{height:4px;border-radius:2px;background:#EDEFF4;overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;background:#2E5BFF}

/* ---------- 框架章 ---------- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}
.pane{border:1px solid #E4E7EF;border-radius:12px;padding:18px 20px}
.pane.now{background:#FAFBFD}
.pane.next{background:#F3FBF7;border-color:#CFEADF}
.pane .pt{font-size:11px;font-weight:700;letter-spacing:.06em;color:#8A93A6;margin-bottom:8px}
.pane.next .pt{color:#0F7A5A}
.pane h4{font-size:16px;font-weight:700;margin-bottom:8px}
.pane p{font-size:13px;line-height:1.85;color:#4A5468}
.pane .tagline{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
.pane .tagline i{font-style:normal;font-size:11px;padding:4px 9px;border-radius:5px;background:#EEF1F7;color:#6B7280}
.pane.next .tagline i{background:#E4F5EC;color:#0F7A5A}
.why{margin-top:26px}
.why .w{display:flex;gap:14px;padding:15px 0;border-bottom:1px solid #EFF1F6}
.why .w em{font-style:normal;font-size:11px;font-weight:700;color:#2E5BFF;flex:0 0 22px;padding-top:2px}
.why .w b{display:block;font-size:14.5px;font-weight:600;margin-bottom:5px}
.why .w p{font-size:13px;line-height:1.8;color:#4A5468}
.why .w p u{text-decoration:none;color:#C6392F;font-weight:600}
.lv{margin-top:28px}
.lvr{display:flex;gap:0;align-items:stretch;margin-bottom:10px}
.lvr .lk{flex:0 0 92px;font-size:11px;font-weight:700;color:#2E5BFF;padding:14px 0 0 2px}
.lvr .lc{flex:1;border:1px solid #E4E7EF;border-left:3px solid #2E5BFF;border-radius:0 10px 10px 0;padding:13px 16px;background:#FAFBFD}
.lvr.side .lc{border-left-color:#C3CAD8;background:#fff}
.lvr.side .lk{color:#8A93A6}
.lvr .lc b{font-size:14px;font-weight:600;display:block;margin-bottom:4px}
.lvr .lc p{font-size:12.5px;line-height:1.8;color:#4A5468}
.lvr .lc .from{margin-top:7px;font-size:11px;color:#8A93A6}
.lvr .lc .from i{font-style:normal;color:#2E5BFF;font-weight:600}
table{width:100%;border-collapse:collapse;margin-top:26px;font-size:13px}
th{text-align:left;font-size:11.5px;font-weight:600;color:#8A93A6;padding:10px 12px;background:#F6F7FA;border-bottom:1px solid #E4E7EF}
td{padding:13px 12px;border-bottom:1px solid #EFF1F6;line-height:1.8;color:#4A5468;vertical-align:top}
td b{color:#1B2033}
footer{padding:34px 0 60px;font-size:11.5px;color:#B0B7C5}
</style>
</head>
<body>
<div class="wrap">

<div class="hero">
  <div class="eyebrow">OS5 · 笔记</div>
  <h1>12 个痛点，每个痛点一条完整链路</h1>
  <p class="lead">按痛点往下拆：用户身上发生的现象 → 他真正要的是什么 → 我们做什么 → 这件事在手机上从头到尾怎么走。三个品类的痛点走完，最后一章回答框架为什么要动、动成什么层级。</p>
  <div class="idx" id="idx"></div>
  <p class="meta">2026-09-10 ｜ 内容助手 ｜ 屏幅按方案设计稿的真机结构画</p>
</div>

<div id="body"></div>

<footer>OS5 笔记 · 12 个痛点与各自的交互链路 · 2026-09-10</footer>
</div>

<script>
/* ============ 屏渲染 ============ */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function blk(b){
  switch(b.t){
    case 'sb': return '<div class="sb"><span>'+(b.time||'9:41')+'</span><span>••••</span></div>';
    case 'nav': return '<div class="nb">'+(b.back?'<span class="bk">‹ '+esc(b.back)+'</span>':'')+'<span class="nt">'+esc(b.title||'')+'</span>'+(b.right?'<span class="ri">'+esc(b.right)+'</span>':'')+'</div>';
    case 'search': return '<div class="sr"><span>搜索笔记</span><span class="ai"></span></div>';
    case 'cats': return '<div class="bd"><div class="cats">'+b.cards.map(cardCat).join('')+'</div></div>';
    case 'wide': return '<div class="bd"><div class="wc"><div class="ct" style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px"><b style="font-size:11px">'+esc(b.title)+'</b><i style="font-style:normal;font-size:8.5px;color:#98A0B2">'+esc(b.count)+'</i></div><div class="tiles">'+b.tiles.map(function(t){return '<div class="tile"><b>'+esc(t[0])+'</b><em>'+esc(t[1])+'</em></div>'}).join('')+'</div></div></div>';
    case 'todo': return '<div class="bd">'+(b.group?'<div class="sec-l">'+esc(b.group)+'</div>':'')+b.items.map(function(i){
        return '<div class="trow"><span class="box'+(i.done?' on':'')+'"></span><span class="tx">'+(i.done?'<s>'+esc(i.text)+'</s>':esc(i.text))+(i.src?'<i>'+esc(i.src)+'</i>':'')+'</span><span class="mt'+(i.hot?' o':'')+'">'+esc(i.meta||'')+'</span></div>'}).join('')+'</div>';
    case 'sec': return '<div class="bd"><div class="sec-l">'+esc(b.text)+'</div></div>';
    case 'card': return '<div class="bd"><div class="card">'+(b.title?'<div class="ch">'+esc(b.title)+'</div>':'')+(b.sub?'<div class="cs">'+esc(b.sub)+'</div>':'')+(b.rows||[]).map(function(r){return '<div class="kv"><i>'+esc(r[0])+'</i><span>'+esc(r[1])+'</span></div>'}).join('')+'</div></div>';
    case 'qt': return '<div class="bd"><div class="qt'+(b.hl?' hl':'')+'">'+esc(b.text)+'</div></div>';
    case 'list': return '<div class="bd">'+b.items.map(function(i){return '<div class="li"><b>'+esc(i.title)+'</b>'+(i.desc?'<p>'+esc(i.desc)+'</p>':'')+(i.meta?'<em>'+esc(i.meta)+'</em>':'')+'</div>'}).join('')+'</div>';
    case 'btns': return '<div class="bd"><div class="btns">'+b.items.map(function(i){return '<b class="'+(i[1]?'p':'')+'">'+esc(i[0])+'</b>'}).join('')+'</div></div>';
    case 'chips': return '<div class="bd"><div class="chips">'+b.items.map(function(i,n){return '<b class="'+(n===b.active?'on':'')+'">'+esc(i)+'</b>'}).join('')+'</div></div>';
    case 'tabs': return '<div class="bd"><div class="tabs">'+b.items.map(function(i,n){return '<b class="'+(n===b.active?'on':'')+'">'+esc(i)+'</b>'}).join('')+'</div></div>';
    case 'bub': return '<div class="bd"><div class="bub'+(b.me?' me':'')+'">'+esc(b.text)+'</div></div>';
    case 'mount': return '<div class="bd"><span class="mount">＋ '+esc(b.text)+'</span></div>';
    case 'wave': return '<div class="bd">'+(b.rec?'<div class="rec"><u></u>'+esc(b.rec)+'</div>':'')+'<div class="wave">'+Array.from({length:26},function(_,i){return '<i style="height:'+(20+Math.abs(Math.sin(i*1.7))*80)+'%"></i>'}).join('')+'</div></div>';
    case 'notif': return '<div class="bd"><div class="notif"><div class="na">'+esc(b.app)+'</div><b>'+esc(b.title)+'</b><p>'+esc(b.text)+'</p></div></div>';
    case 'cloud': return '<div class="bd"><div class="cloud">'+b.items.map(function(i){return '<span class="'+(i[3]?'b':'')+'" style="left:'+i[1]+'%;top:'+i[2]+'%">'+esc(i[0])+'</span>'}).join('')+'</div></div>';
    case 'prog': return '<div class="bd"><div class="prog"><i style="width:'+b.v+'%"></i></div><div class="sec-l">'+esc(b.text)+'</div></div>';

    case 'tb': return '<div class="tb"><span class="'+(b.active===0?'on':'')+'">'+esc(b.items[0])+'</span><u class="o">●</u><u>＋</u><span class="'+(b.active===1?'on':'')+'">'+esc(b.items[1])+'</span></div>';

function cardCat(c){
  var inner='';
  if(c.style==='todo'){inner=c.items.map(function(i){return '<div class="ci"><span class="box'+(i[2]?' on':'')+'"></span><span>'+esc(i[0])+'</span><em>'+esc(i[1])+'</em></div>'}).join('')}
  else if(c.style==='course'){inner=c.items.map(function(i){return '<div class="cl"><span>'+esc(i[0])+'</span><em>'+esc(i[1])+'</em></div>'}).join('')}
  else if(c.style==='cloud'){inner='<div class="cloud" style="height:74px">'+c.items.map(function(i){return '<span class="'+(i[3]?'b':'')+'" style="left:'+i[1]+'%;top:'+i[2]+'%">'+esc(i[0])+'</span>'}).join('')+'</div>'}
  else if(c.style==='wallet'){var bg=['#E7EDFF','#E4F5EC','#FFF1DF','#F0EEFF'];inner='<div class="wal">'+c.items.map(function(i,n){return '<div style="top:'+(n*17)+'px;background:'+bg[n%4]+'">'+esc(i[0])+'</div>'}).join('')+'</div>'}
  return '<div class="cc"><div class="ct"><b>'+esc(c.title)+'</b><i>'+esc(c.count)+'</i></div>'+inner+'</div>';
}
function screen(s){
  var body=(s.body||[]).map(blk).join('');
  return '<div class="step"><div class="sh"><span class="sn">'+s.n+'</span><span class="stt">'+esc(s.t)+'</span>'+(s.tag?'<span class="tg'+(s.us?' us':'')+'">'+esc(s.tag)+'</span>':'')+'</div>'
    +'<div class="ph-f'+(s.white?' w':'')+'">'+body+'<div class="bar"></div></div>'
    +'<div class="cap">'+esc(s.cap||'')+'</div></div>';
}
function chain(c){
  var steps=c.steps.map(function(s,i){return screen(Object.assign({n:String(i+1).padStart(2,'0')},s))});
  return '<div class="chain"><div class="ch-t">交互链路</div><div class="ch-f">'+esc(c.flow)+'</div><div class="rail">'+steps.join('<div class="arrow">→</div>')+'</div></div>';
}
function pain(p){
  return '<div class="pain"><div class="pid">'+p.id+'</div>'
    +'<div class="lb a">现象</div><h3>'+esc(p.h)+'</h3><p class="ph">'+esc(p.ph)+'</p>'
    +'<div class="need"><div class="lb b">真实需求</div><h4>'+esc(p.need)+'</h4></div>'
    +'<div class="sol"><div class="lb c">方案</div><h4>'+esc(p.sol)+'</h4><ul>'+p.li.map(function(l){return '<li>'+esc(l)+'</li>'}).join('')+'</ul>'
    +(p.dep?'<div class="dep"><b>依赖 / 待定</b>'+esc(p.dep)+'</div>':'')+'</div>'
    +chain(p.chain)+'</div>';
}
