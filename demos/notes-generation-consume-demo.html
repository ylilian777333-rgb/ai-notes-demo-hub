<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "SF Pro Display", "PingFang SC", sans-serif; background: #1a1a1a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }

h1.page-title { color: #fff; font-size: 18px; margin-bottom: 8px; }
p.page-desc { color: #999; font-size: 13px; margin-bottom: 20px; text-align: center; max-width: 600px; }

/* 场景导航 */
.scene-nav { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
.scene-nav button { padding: 8px 16px; border: 1px solid #444; background: #2a2a2a; color: #ccc; border-radius: 20px; font-size: 13px; cursor: pointer; transition: all .2s; }
.scene-nav button.active { background: #ff6900; border-color: #ff6900; color: #fff; }
.scene-nav button:hover { border-color: #ff6900; }

/* 手机框 */
.phone { width: 375px; height: 812px; border-radius: 40px; border: 6px solid #333; background: #fff; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.phone .statusbar { height: 48px; background: #fff; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-size: 14px; font-weight: 600; color: #333; }
.phone .screen { height: calc(100% - 48px); overflow-y: auto; display: flex; flex-direction: column; }

/* 通用样式 */
.note-header { padding: 16px 20px; border-bottom: 1px solid #f0f0f0; }
.note-header .title { font-size: 20px; font-weight: 700; }
.note-header .meta { font-size: 12px; color: #999; margin-top: 4px; }
.note-body { padding: 16px 20px; flex: 1; overflow-y: auto; }
.note-body p { font-size: 14px; line-height: 1.8; color: #333; margin-bottom: 12px; }
.note-body h3 { font-size: 15px; font-weight: 600; margin: 16px 0 8px; }

/* 产出物卡片（嵌入笔记中） */
.output-card { margin: 16px 0; border-radius: 12px; overflow: hidden; border: 1px solid #e8e8e8; background: #fafafa; }
.output-card .card-header { padding: 12px 16px; display: flex; align-items: center; gap: 10px; background: #f5f5f5; border-bottom: 1px solid #eee; }
.output-card .card-header .icon { font-size: 20px; }
.output-card .card-header .label { font-size: 14px; font-weight: 500; flex: 1; }
.output-card .card-header .action { font-size: 12px; color: #ff6900; cursor: pointer; font-weight: 500; }
.output-card .card-body { padding: 12px 16px; }

/* 播客播放器 */
.podcast-player { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.podcast-player .play-btn { width: 40px; height: 40px; border-radius: 50%; background: #ff6900; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; cursor: pointer; flex-shrink: 0; }
.podcast-player .wave { flex: 1; height: 32px; background: linear-gradient(90deg, #ff6900 30%, #eee 30%); border-radius: 4px; opacity: .3; }
.podcast-player .time { font-size: 12px; color: #666; }

/* PPT 预览 */
.ppt-preview { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; }
.ppt-slide { width: 120px; height: 68px; border-radius: 6px; background: linear-gradient(135deg, #4a90d9, #357abd); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; text-align: center; padding: 4px; }

/* 思维导图预览 */
.mindmap-preview { padding: 12px; background: #fff; border-radius: 8px; }
.mindmap-preview .node { padding: 6px 12px; border-radius: 6px; display: inline-block; margin: 2px 4px; font-size: 12px; }
.mindmap-preview .root { background: #ff6900; color: #fff; font-weight: 600; }
.mindmap-preview .child { background: #fff3e8; color: #e65100; border: 1px solid #ffcc80; }
.mindmap-preview .tree { display: flex; flex-direction: column; gap: 4px; margin-left: 20px; margin-top: 8px; }

/* 知识卡预览 */
.flashcard { background: #fff; border-radius: 10px; padding: 16px; text-align: center; border: 2px solid #e8e8e8; min-height: 80px; display: flex; flex-direction: column; justify-content: center; }
.flashcard .q { font-size: 14px; font-weight: 500; color: #333; }
.flashcard .a { font-size: 13px; color: #666; margin-top: 8px; display: none; }
.flashcard .flip-hint { font-size: 11px; color: #bbb; margin-top: 8px; }

/* 待办卡片 */
.todo-card-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f5f5f5; }
.todo-card-item .cb { width: 18px; height: 18px; border: 2px solid #ddd; border-radius: 50%; flex-shrink: 0; }
.todo-card-item .text { font-size: 14px; color: #333; }

/* 对话入口 */
.chat-bar { height: 56px; border-top: 1px solid #eee; display: flex; align-items: center; padding: 0 16px; gap: 10px; background: #fff; flex-shrink: 0; }
.chat-bar .input { flex: 1; height: 36px; border-radius: 18px; background: #f5f5f5; padding: 0 16px; font-size: 13px; border: none; color: #333; }
.chat-bar .send { width: 36px; height: 36px; border-radius: 50%; background: #ff6900; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; cursor: pointer; }

/* 快捷指令chips */
.quick-chips { display: flex; gap: 6px; padding: 8px 16px; overflow-x: auto; border-top: 1px solid #f5f5f5; flex-shrink: 0; }
.quick-chips .chip { padding: 6px 12px; border-radius: 16px; background: #fff3e8; color: #e65100; font-size: 12px; white-space: nowrap; cursor: pointer; border: 1px solid #ffcc80; }

/* 分享浮层 */
.share-overlay { position: absolute; bottom: 0; left: 0; right: 0; background: #fff; border-radius: 16px 16px 0 0; padding: 20px; box-shadow: 0 -4px 20px rgba(0,0,0,.1); display: none; z-index: 10; }
.share-overlay.show { display: block; }
.share-overlay h4 { font-size: 15px; margin-bottom: 12px; }
.share-targets { display: flex; gap: 16px; }
.share-targets .target { text-align: center; cursor: pointer; }
.share-targets .target .icon { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 4px; }
.share-targets .target .name { font-size: 11px; color: #666; }

/* 场景说明标签 */
.scene-tag { position: absolute; top: 56px; left: 16px; right: 16px; padding: 8px 12px; background: rgba(255,105,0,.08); border-radius: 8px; font-size: 12px; color: #e65100; z-index: 5; border: 1px solid rgba(255,105,0,.2); }
.scene-tag strong { font-weight: 600; }
.scene-tag .api { color: #666; font-family: monospace; font-size: 11px; }

/* 能力标记 */
.cap-badge { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
.cap-badge.exist { background: #e8f5e9; color: #2e7d32; }
.cap-badge.need { background: #fff3e0; color: #e65100; }

.hidden { display: none; }
</style>

function showScene(key) {
  document.querySelectorAll('.scene-nav button').forEach(b => b.classList.remove('active'));
  event.currentTarget.classList.add('active');
  const scene = scenes[key];
  const screen = document.getElementById('screen');
  screen.innerHTML = `<div class="scene-tag">${scene.tag}</div><div style="height:80px;flex-shrink:0;"></div>${scene.content}`;
}

// 初始化
showScene('podcast');
// hack: 手动触发按钮active
document.querySelector('.scene-nav button').classList.add('active');
