let cf=0,cs=0;
function render(){
  const f=flows[cf];
  document.getElementById('info').innerHTML=`<h2>${f.title}</h2><p>${f.desc}</p>${f.tag?`<span class="tag">${f.tag}</span>`:''}`;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===cf));
  cs=0;step();
}
function step(){
  const f=flows[cf],s=f.screens[cs],el=document.getElementById('screen');
  el.querySelectorAll('.screen').forEach(e=>{e.classList.remove('active');setTimeout(()=>e.remove(),350)});
  const div=document.createElement('div');div.className='screen';div.innerHTML=s.html;el.appendChild(div);
  requestAnimationFrame(()=>div.classList.add('active'));
  document.getElementById('dots').innerHTML=f.screens.map((_,i)=>`<div class="dot ${i===cs?'active':''}"></div>`).join('');
  document.getElementById('label').innerHTML=`<h3>${s.name}</h3><p class="${s.hl?'hl':''}">${s.sub}</p>`;
  document.getElementById('prev').classList.toggle('off',cs===0);
  document.getElementById('next').classList.toggle('off',cs===f.screens.length-1);
}
function next(){if(cs<flows[cf].screens.length-1){cs++;step()}}
function prev(){if(cs>0){cs--;step()}}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{cf=+t.dataset.f;render()}));
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});
render();
</script>
