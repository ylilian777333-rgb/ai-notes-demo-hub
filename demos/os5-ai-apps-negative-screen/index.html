<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7ea79a">
<title>场景化 AI App · 负一屏（OS5 · 短期日程 / 长途出行）</title>
<script>if(/OS5SceneDemo/.test(navigator.userAgent)||/[?&]apk=1/.test(location.search))document.documentElement.classList.add('apk');</script>
<link rel="stylesheet" href="../os5-kit/os5.css">
<style>
  /* 负一屏：392×851 设计稿画布，按屏幕等比铺满（壁纸、图标、卡片位置与 Figma 3981:88322 一致）*/
  .screen{background:#7d9c92}
  .neg{position:absolute;left:50%;top:50%;width:392px;height:851px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:50% 50%;overflow:hidden}
  .wall{position:absolute;left:0;top:-1px;width:392px;height:851px;background:url(../os5-kit/assets/wall-home.jpg) 0 0/100% 100% no-repeat}
  .tint{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s ease,background .8s ease}
  .neg.tod-d .tint{opacity:1;background:linear-gradient(180deg,rgba(255,250,236,.20) 0%,rgba(255,250,236,.10) 45%,rgba(255,250,236,0) 62%)}
  .neg.tod-e .tint{opacity:1;background:linear-gradient(180deg,rgba(255,148,96,.34) 0%,rgba(236,120,150,.20) 36%,rgba(236,120,150,.06) 54%,rgba(236,120,150,0) 64%)}
  .neg.tod-n .tint{opacity:1;background:linear-gradient(180deg,rgba(6,12,38,.62) 0%,rgba(10,18,52,.46) 38%,rgba(10,18,52,.18) 54%,rgba(10,18,52,0) 64%)}
  .clk{position:absolute;left:0;right:0;top:86px;text-align:center;color:#fff;pointer-events:none}
  .cdate{font-size:18.5px;font-weight:500;line-height:25px;letter-spacing:.2px}
  .ctime{font-size:92px;font-weight:400;line-height:100px;letter-spacing:1.2px;margin-top:1px}
  .cards{position:absolute;inset:0}
  .cards .gcard,.cards .wpair{position:absolute}
  .cards>*{cursor:pointer;transition:transform .15s}
  .cards>*:active{transform:scale(.985)}
  /* 负一屏航班卡（Figma 3981:89334：332×189，内边距 11）比落地页的航班卡更紧凑 */
  .cards .flt{padding:11px 11px 11px}
  .cards .flt .fd{font-size:12.5px;line-height:17px;margin-left:4px}
  .cards .flt .fl{margin:5px 4px 0}
  .cards .flt .fl b{font-size:18px;font-weight:400;line-height:24px}
  .cards .flt .fl img{width:72px}
  .cards .flt .fl .tr{font-size:24px;line-height:24px}
  .cards .flt .fp{font-size:11px;margin:2px 4px 0}
  .cards .flt .fp span:nth-child(2){font-size:9px}
  .cards .flt .fline{margin:8px 4px 7px}
  .cards .flt .stats b{font-size:13px;font-weight:400;line-height:17px}
  .cards .flt .stats s{font-size:9px;margin-top:1px}
  .cards .flt .fbtns{margin-top:8px;gap:7px}
  .cards .flt .fb{height:31px;border-radius:10px;font-size:12px}
  .cards .taxi .opts div{height:36px}
  .cards .taxi .gbtns{margin-top:10px}
  .cards .swap{animation:cswap .55s cubic-bezier(.2,.8,.2,1)}
  @keyframes cswap{0%{opacity:0;transform:translateY(14px) scale(.98)}100%{opacity:1;transform:none}}
  .landing{position:absolute;inset:0;z-index:100;width:100%;height:100%;border:none;background:var(--page);
    transform:translateY(101%);transition:transform .36s cubic-bezier(.32,.72,0,1)}
  .landing.open{transform:translateY(0)}
  .toast{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);z-index:160;background:rgba(28,28,30,.94);color:#fff;font-size:13.5px;font-weight:500;
    padding:11px 18px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:84%;text-align:center;line-height:1.45;animation:tin .2s ease}
  @keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

  /* 桌面演示外壳：左侧两大品类菜单 + 设备 + 时间阶段 */
  body.hub{gap:14px}
  .stagewrap{display:flex;align-items:flex-start;justify-content:center;gap:28px}
  .devcol{display:flex;flex-direction:column;align-items:center;gap:14px}
  .scenes{width:214px;flex:0 0 auto;background:rgba(255,255,255,.78);border:1px solid rgba(20,30,60,.06);border-radius:24px;padding:12px;
    box-shadow:0 20px 54px rgba(30,42,74,.12);position:sticky;top:22px}
  .scenes .hd{font-size:12px;font-weight:700;color:#9aa2b2;padding:4px 12px 6px;letter-spacing:.3px}
  .scenes .grp{margin-top:8px}
  .scenes .gt{padding:8px 12px 6px}
  .scenes .gt b{display:block;font-size:15px;font-weight:700;color:#14161c}
  .scenes .gt s{display:block;font-size:11px;color:#9aa2b2;margin-top:2px}
  .scenes .grp+.grp{border-top:1px solid rgba(20,30,60,.07);padding-top:6px}
  .scenes button{font-size:14px;font-weight:600;color:#49505f;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;width:100%;text-align:left}
  .scenes button:hover{background:rgba(20,30,60,.045)}
  .scenes button .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .scenes button .n{margin-left:auto;font-size:11px;font-weight:500;color:#a7aebb}
  .scenes button.on{background:#fff;color:#14161c;font-weight:700;box-shadow:0 3px 12px rgba(30,42,74,.12)}
  .stages{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:520px}
  .stages button{font-size:12px;font-weight:600;border:1px solid #dfe3ea;background:#fff;color:#5a6270;border-radius:18px;padding:7px 12px}
  .stages button i{font-weight:500;opacity:.62;margin-left:5px}
  .stages button.on{background:var(--yellow);border-color:var(--yellow);color:#4a3600}
  .stagecap{font-size:12px;color:#7a8394;text-align:center;margin-top:-4px}
  .stagecap b{color:#2b303a;font-weight:650}

  /* 手机 / APK 演示控制：右上角小圆点 → 底部面板（两大品类 + 时间阶段）；卡片左右滑切阶段 */
  .dbtn{display:none;position:absolute;right:14px;top:calc(48px * var(--s,1));z-index:120;width:30px;height:30px;border-radius:50%;
    background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.4);
    align-items:center;justify-content:center;color:#fff}
  .dbtn svg{width:16px;height:16px}
  .dsheet{position:absolute;inset:0;z-index:150;pointer-events:none}
  .dsheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.32);opacity:0;transition:opacity .25s}
  .dsheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:82%;overflow:auto;background:#f6f6f8;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));
    transform:translateY(102%);transition:transform .34s cubic-bezier(.32,.72,0,1);scrollbar-width:none}
  .dsheet.open{pointer-events:auto}.dsheet.open .bg{opacity:1}.dsheet.open .pn{transform:none}
  .dsheet .gr{width:36px;height:4px;border-radius:2px;background:#d4d4d8;margin:0 auto 10px}
  .dsheet h3{font-size:18px;font-weight:650;display:flex;align-items:center;justify-content:space-between}
  .dsheet h3 button{font-size:13px;font-weight:500;color:var(--t3);background:rgba(0,0,0,.05);border-radius:16px;padding:5px 12px}
  .dsheet .seg{display:flex;background:rgba(0,0,0,.05);border-radius:14px;padding:3px;margin:14px 0 12px}
  .dsheet .seg button{flex:1;height:34px;border-radius:11px;font-size:14px;font-weight:600;color:var(--t3)}
  .dsheet .seg button.on{background:#fff;color:#000;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .dsheet .sc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .dsheet .sc button{height:44px;border-radius:14px;background:#fff;font-size:14px;font-weight:600;color:#222;display:flex;align-items:center;justify-content:center;gap:6px}
  .dsheet .sc button.on{box-shadow:inset 0 0 0 1.5px var(--blue);color:var(--blue)}
  .dsheet .sc button i{width:7px;height:7px;border-radius:50%}
  .dsheet .lb{font-size:13px;color:var(--t4);margin:16px 2px 8px}
  .dsheet .st{display:flex;flex-wrap:wrap;gap:8px}
  .dsheet .st button{height:36px;padding:0 13px;border-radius:18px;background:#fff;font-size:13px;font-weight:600;color:#333}
  .dsheet .st button i{font-weight:400;color:var(--t4);margin-left:5px}
  .dsheet .st button.on{background:var(--yellow);color:#4a3600}
  .dsheet .st button.on i{color:#6b5300}
  .dsheet .tip{font-size:12px;color:var(--t4);margin-top:14px;line-height:1.6}
  @media (max-width:500px){ .dbtn{display:flex} }
  html.apk .dbtn{display:flex}
  .landing.open~.dbtn{display:none!important}
</style>
</head>
<body class="hub">
<div class="cap">场景化 AI App · 负一屏（OS5）<span>左侧按「短期日程 / 长途出行」切场景 · 下方切时间阶段（时钟、日期、卡片、落地页一起变）· 点卡片进入高保真落地页</span></div>

<div class="stagewrap">
<nav class="scenes" id="scenes" aria-label="切换场景"></nav>
<div class="devcol">
<div class="device">
  <div class="screen" id="screen">
    <div class="neg" id="neg">
      <div class="wall"></div><div class="tint"></div>
      <div class="sb light"><div class="row"><span class="tm" id="sbTime">8:12</span><span class="ics" id="sbIcs"></span></div></div>
      <div class="clk"><div class="cdate" id="cdate"></div><div class="ctime" id="ctime"></div></div>
      <div class="cards" id="cards"></div>
    </div>
    <iframe class="landing" id="landing" title="场景落地页"></iframe>
    <button class="dbtn" id="dbtn" aria-label="演示控制"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg></button>
    <div class="dsheet" id="dsheet"><div class="bg"></div><div class="pn">
      <div class="gr"></div>
      <h3>演示控制<button id="dclose">完成</button></h3>
      <div class="seg" id="dseg"></div>
      <div class="sc" id="dsc"></div>
      <div class="lb" id="dlb">时间阶段</div>
      <div class="st" id="dst"></div>
      <div class="tip">在卡片上左右滑动也能切换时间阶段；点卡片进入落地页，返回键回到负一屏。</div>
    </div></div>
    <div class="cutout"></div>
  </div>
</div>
<div class="stages" id="stages"></div>
<div class="stagecap" id="stagecap"></div>
</div>
</div>

<script src="../os5-kit/scenes.js"></script>
<script src="../os5-kit/cards.js"></script>
<script>
(function(){
  var D=window.OS5_SCENES, S=D.scenes, C=window.OS5Cards;
  var neg=document.getElementById('neg'), screenEl=document.getElementById('screen'), cardsEl=document.getElementById('cards'), landingEl=document.getElementById('landing');
  document.getElementById('sbIcs').innerHTML=C.icons.signal+C.icons.wifi+C.icons.batt;

  /* 画布等比铺满屏幕（cover），保证壁纸/图标/卡片与设计稿位置一致 */
  function fit(){ var w=screenEl.clientWidth, h=screenEl.clientHeight; var s=Math.max(w/392,h/851); neg.style.setProperty('--s',s); screenEl.style.setProperty('--s',s); }
  window.addEventListener('resize',fit); fit();

  /* ---------- 状态 ---------- */
  var raw=(location.hash||'').replace(/^#/,''), wantOpen=/-open$/.test(raw);
  var m=raw.replace(/-open$/,'').match(/^([a-z]+)(?:-s(\d+))?$/);
  var scene=(m&&S[m[1]])?m[1]:'today';
  function defStage(sc){ return sc==='travel'?2:0; }
  var cur=(m&&m[2]!=null&&S[scene].stages[+m[2]])?+m[2]:defStage(scene);
  var ckState={};
  function stg(){ return S[scene].stages[cur]; }

  /* ---------- 时钟 / 日期（含农历）/ 壁纸时段 ---------- */
  function tod(tm){ var p=(tm||'08:00').split(':'), h=+p[0]+(+p[1])/60; if(h<5) return 'n'; if(h<7) return 'e'; if(h<11) return 'm'; if(h<16.5) return 'd'; if(h<19.2) return 'e'; return 'n'; }
  function renderClock(){
    var s=stg(), tm=s.tm.replace(/^0/,''), dt=s.dt.split(' '), day=dt[0], wk=dt[1]||'';
    document.getElementById('ctime').textContent=tm;
    document.getElementById('sbTime').textContent=tm;
    document.getElementById('cdate').textContent=day+wk+(D.lunar[day]?' '+D.lunar[day]:'');
    neg.classList.remove('tod-m','tod-d','tod-e','tod-n'); neg.classList.add('tod-'+tod(s.tm));
    document.getElementById('stagecap').innerHTML='<b>'+S[scene].name+'</b> · 第 '+(cur+1)+' / '+S[scene].stages.length+' 阶段 · 模拟时间 '+s.dt+' '+s.tm+' · 数据来源：'+S[scene].src;
  }

  /* ---------- 卡片（Figma 组件，位置按设计稿）---------- */
  function applyChecks(){
    cardsEl.querySelectorAll('.ck').forEach(function(el,i){
      var k=scene+':'+cur+':'+i; if(!(k in ckState)) return;
      var d=ckState[k]; el.classList.toggle('done',d); el.querySelector('.box').innerHTML=d?C.icons.check:'';
    });
  }
  function renderCard(anim){
    cardsEl.innerHTML=C.render(stg().card,{where:'neg'});
    applyChecks();
    var el=cardsEl.firstElementChild;
    if(anim&&el){ el.classList.add('swap'); }
  }

  /* ---------- 落地页（iframe，切阶段时 postMessage 实时同步）---------- */
  function postStage(init){ try{ landingEl.contentWindow.postMessage({os5stage:cur,init:!!init},'*'); }catch(e){} }
  landingEl.addEventListener('load',function(){ postStage(true); });
  function openLanding(){
    var lp=S[scene].landing; if(!lp) return;
    if(landingEl.dataset.lp===lp){ postStage(true); } else { landingEl.dataset.lp=lp; landingEl.src=lp+'?s='+cur+(document.documentElement.classList.contains('apk')?'&apk=1':''); }
    landingEl.classList.add('open'); syncHash(true);
  }
  function closeLanding(){ landingEl.classList.remove('open'); syncHash(false); }
  function syncLanding(){ if(landingEl.classList.contains('open')&&landingEl.dataset.lp===S[scene].landing) postStage(false); }
  window.addEventListener('message',function(e){ var d=e.data; if(d==='close-landing'){ closeLanding(); return; }
    if(d&&typeof d==='object'&&d.os5setstage!=null&&S[scene].stages[+d.os5setstage]){ cur=+d.os5setstage; renderAll(false); } });

  var tT=null;
  function toast(msg){ var old=screenEl.querySelector('.toast'); if(old) old.remove(); var t=document.createElement('div'); t.className='toast'; t.textContent=msg; screenEl.appendChild(t); clearTimeout(tT); tT=setTimeout(function(){ t.remove(); },2000); }

  cardsEl.addEventListener('click',function(e){
    var b=e.target.closest('[data-a]'), ck=e.target.closest('.ck');
    if(b){ e.stopPropagation(); var a=b.getAttribute('data-a');
      if(a==='open'){ openLanding(); return; }
      if(a.indexOf('toast:')===0){ toast(a.slice(6)); return; }
      if(a.indexOf('stage:')===0){ var n=+a.slice(6); if(S[scene].stages[n]){ cur=n; renderAll(true); syncLanding(); toast(n===2&&scene==='course'?'已开始语音速记，老师讲的内容会自动转成文字 🎙':'已为你整理好，进入下一步'); } return; }
      return; }
    var tb=e.target.closest('[data-toast]'); if(tb){ e.stopPropagation(); toast(tb.getAttribute('data-toast')); return; }
    if(ck){ var i=[].indexOf.call(cardsEl.querySelectorAll('.ck'),ck), k=scene+':'+cur+':'+i; ckState[k]=!ck.classList.contains('done'); applyChecks(); return; }
    if(e.target.closest('.gcard,.wpair')) openLanding();
  });

  /* 卡片左右滑：切时间阶段 */
  (function(){ var x0=null,y0=null,t0=0;
    cardsEl.addEventListener('touchstart',function(e){ var t=e.touches[0]; x0=t.clientX; y0=t.clientY; t0=Date.now(); },{passive:true});
    cardsEl.addEventListener('touchend',function(e){ if(x0==null) return; var t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0; x0=null;
      if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5&&Date.now()-t0<700){ var n=cur+(dx<0?1:-1); if(S[scene].stages[n]){ cur=n; renderAll(true); syncLanding(); } } },{passive:true});
  })();

  /* ---------- 桌面：左侧两大品类菜单 + 阶段条 ---------- */
  function renderMenu(){
    var h='<div class="hd">场景 AI App</div>';
    D.groups.forEach(function(g){
      h+='<div class="grp"><div class="gt"><b>'+g.name+'</b><s>'+g.desc+'</s></div>';
      D.order.forEach(function(k){ var sc=S[k]; if(sc.group!==g.k) return;
        h+='<button class="'+(k===scene?'on':'')+'" data-s="'+k+'"><span class="d" style="background:'+sc.color+'"></span>'+sc.name+'<span class="n">'+sc.stages.length+' 个阶段</span></button>'; });
      h+='</div>';
    });
    var w=document.getElementById('scenes'); w.innerHTML=h;
    w.querySelectorAll('button[data-s]').forEach(function(b){ b.onclick=function(){ pickScene(b.getAttribute('data-s')); }; });
  }
  function renderStages(){
    var w=document.getElementById('stages');
    w.innerHTML=S[scene].stages.map(function(s,i){ return '<button class="'+(i===cur?'on':'')+'" data-i="'+i+'">'+(i+1)+'. '+s.k+'<i>'+s.tm+'</i></button>'; }).join('');
    w.querySelectorAll('button').forEach(function(b){ b.onclick=function(){ pickStage(+b.getAttribute('data-i')); }; });
  }
  function pickScene(sc){ if(sc===scene&&!landingEl.classList.contains('open')) return; scene=sc; cur=defStage(sc); closeLanding(); renderAll(true); }
  function pickStage(n){ if(n===cur) return; cur=n; renderAll(true); syncLanding(); }

  /* ---------- 手机 / APK：演示控制面板 ---------- */
  var ds=document.getElementById('dsheet'), segG=S[scene].group;
  function renderSheet(){
    document.getElementById('dseg').innerHTML=D.groups.map(function(g){ return '<button class="'+(g.k===segG?'on':'')+'" data-g="'+g.k+'">'+g.name+'</button>'; }).join('');
    document.getElementById('dsc').innerHTML=D.order.filter(function(k){ return S[k].group===segG; }).map(function(k){ return '<button class="'+(k===scene?'on':'')+'" data-s="'+k+'"><i style="background:'+S[k].color+'"></i>'+S[k].name+'</button>'; }).join('');
    document.getElementById('dlb').textContent=S[scene].name+' · 时间阶段';
    document.getElementById('dst').innerHTML=S[scene].stages.map(function(s,i){ return '<button class="'+(i===cur?'on':'')+'" data-i="'+i+'">'+s.k+'<i>'+s.tm+'</i></button>'; }).join('');
  }
  document.getElementById('dbtn').onclick=function(){ segG=S[scene].group; renderSheet(); ds.classList.add('open'); };
  function closeSheet(){ ds.classList.remove('open'); }
  ds.addEventListener('click',function(e){
    if(e.target.classList.contains('bg')||e.target.id==='dclose'){ closeSheet(); return; }
    var g=e.target.closest('[data-g]'); if(g){ segG=g.getAttribute('data-g'); renderSheet(); return; }
    var s=e.target.closest('#dsc [data-s]'); if(s){ pickScene(s.getAttribute('data-s')); segG=S[scene].group; renderSheet(); return; }
    var i=e.target.closest('#dst [data-i]'); if(i){ pickStage(+i.getAttribute('data-i')); renderSheet(); setTimeout(closeSheet,180); }
  });

  /* 系统返回键（APK 调用）：先关面板 → 再关落地页里的弹层 → 再关落地页 */
  window.os5back=function(){
    if(ds.classList.contains('open')){ closeSheet(); return 'handled'; }
    if(landingEl.classList.contains('open')){
      try{ var w=landingEl.contentWindow; if(w&&typeof w.os5back==='function'&&w.os5back()==='handled') return 'handled'; }catch(e){}
      closeLanding(); return 'handled';
    }
    return 'finish';
  };

  function syncHash(open){ try{ history.replaceState(null,'','#'+scene+'-s'+cur+(open?'-open':'')); }catch(e){} }
  function renderAll(anim){ renderMenu(); renderStages(); renderClock(); renderCard(anim); syncHash(landingEl.classList.contains('open')); }
  renderAll(false);
  if(wantOpen) openLanding();
})();
</script>
</body>
</html>
