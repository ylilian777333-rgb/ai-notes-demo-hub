<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日程出行 AI App · 负一屏（OS5 稻城亚丁）</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --ink:#1b1b1b; --ink2:#4a4a4a; --ink3:#8a8a8a; --line:#ededed;
    --paper:#f4f4f6; --accent:#ffbb0f; --blue:#3a7afe; --purpa:#8a7bf0;
  }
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","MiSans","Microsoft YaHei",sans-serif;
    background:radial-gradient(1100px 680px at 50% -8%,#1b2330 0%,#0c0e13 62%);
    min-height:100%;-webkit-font-smoothing:antialiased;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 14px 40px;
  }
  .cap{color:#c6ccd8;font-size:13.5px;font-weight:600;text-align:center}
  .cap span{display:block;color:#7c8498;font-size:11.5px;font-weight:400;margin-top:4px}

  /* device */
  .device{width:390px;height:844px;border-radius:54px;background:#0a0c10;padding:11px;
    box-shadow:0 36px 90px rgba(0,0,0,.55),inset 0 0 0 2px #2a303c;position:relative;flex:0 0 auto}
  .screen{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:#cdd6cf}
  .wall{position:absolute;inset:0;background:
    radial-gradient(90% 60% at 18% 12%, #eef3ea 0%, rgba(238,243,234,0) 55%),
    radial-gradient(80% 55% at 88% 22%, #d3e0d4 0%, rgba(211,224,212,0) 52%),
    radial-gradient(120% 80% at 72% 96%, #a9c0ab 0%, rgba(169,192,171,0) 58%),
    conic-gradient(from 160deg at 60% 45%, #cdddcb, #b7ccb6, #d6e2d2, #c0d2bf, #cdddcb),
    linear-gradient(158deg, #e9f0e6 0%, #c6d6c4 48%, #a6bda7 100%);}
  .wall::after{content:"";position:absolute;inset:0;background:
    radial-gradient(60% 40% at 30% 30%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(50% 36% at 78% 62%, rgba(255,255,255,.22), transparent 60%);}
  .screen .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:30px;background:#0a0c10;border-radius:0 0 18px 18px;z-index:60}

  /* status bar */
  .sb{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;
    padding:16px 26px 0;font-size:14px;font-weight:650;color:#1d1d1d;z-index:40}
  .sb .r{display:flex;align-items:center;gap:6px}
  .sb svg{display:block}
  .batt{font-size:11px;font-weight:700;background:#222;color:#fff;border-radius:4px;padding:1px 5px;line-height:1.3}

  /* home layer */
  .home{position:absolute;inset:0;display:flex;flex-direction:column;z-index:20;transition:opacity .25s, transform .25s}
  .home.hide{opacity:0;transform:scale(1.03);pointer-events:none}
  .clockwrap{text-align:center;margin-top:62px;color:#fff;text-shadow:0 1px 14px rgba(0,0,0,.18)}
  .cdate{font-size:15px;font-weight:600;letter-spacing:.3px;opacity:.96}
  .ctime{font-size:74px;font-weight:600;line-height:1.02;letter-spacing:-1px;margin-top:2px}

  /* AI card */
  .aiwrap{margin:18px 14px 0}
  .aicard{background:rgba(249,250,250,.72);backdrop-filter:blur(34px) saturate(1.4);-webkit-backdrop-filter:blur(34px) saturate(1.4);
    border:1px solid rgba(255,255,255,.6);border-radius:30px;padding:16px 16px 15px;box-shadow:0 18px 44px rgba(20,30,24,.18);
    cursor:pointer;transition:transform .15s}
  .aicard:active{transform:scale(.985)}
  .aihd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .aihd .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
  .aihd .ti{flex:1;min-width:0}
  .aihd .ti b{font-size:16.5px;font-weight:650;display:block;letter-spacing:-.2px}
  .aihd .ti s{font-size:11.5px;color:var(--ink3);font-style:normal;display:block;margin-top:1px}
  .aihd .more{font-size:11px;color:var(--ink3);font-weight:600;background:rgba(0,0,0,.05);border-radius:20px;padding:4px 10px;flex-shrink:0}
  .aibody{display:flex;flex-direction:column;gap:2px}

  /* checklist rows */
  .ck{display:flex;align-items:center;gap:11px;padding:9px 2px;font-size:15px;color:#2a2a2a}
  .ck .box{width:20px;height:20px;border-radius:50%;border:1.6px solid #bdbdbd;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.4)}
  .ck.done .box{background:var(--accent);border-color:var(--accent);color:#fff}
  .ck.done span{color:#aaa;text-decoration:line-through}
  .ck+.ck{border-top:1px solid rgba(0,0,0,.05)}

  /* info rows (flight/weather/car) */
  .row{display:flex;align-items:center;gap:12px;padding:10px 2px}
  .row+.row{border-top:1px solid rgba(0,0,0,.05)}
  .row .ric{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .row .rc{flex:1;min-width:0}
  .row .rc b{font-size:14.5px;font-weight:600;display:block;line-height:1.35}
  .row .rc s{font-size:11.5px;color:var(--ink3);font-style:normal;display:block;margin-top:3px}
  .row .rv{font-size:12px;font-weight:650;color:#2a2a2a;flex-shrink:0;text-align:right}
  .row .rv.hot{color:#e8632a}
  .rbtn{flex-shrink:0;font-size:12.5px;font-weight:650;color:#fff;background:#2b2b2b;border:none;border-radius:20px;padding:7px 14px;cursor:pointer}
  .rbtn.y{background:var(--accent);color:#4a3600}

  /* dynamic pin banner */
  .pin{display:flex;align-items:center;gap:7px;margin:-2px 2px 10px;font-size:11px;font-weight:700;color:#b06a1f}
  .pin .dot{width:6px;height:6px;border-radius:50%;background:#f0a020;box-shadow:0 0 0 3px #f7d58a66}

  /* suggestion (dark) card variant */
  .sug{background:rgba(38,38,40,.82);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:none;color:#eee}
  .sug .aihd .ti b{color:#fff}
  .sug .sgtext{font-size:14px;line-height:1.6;color:#d6d6d8;margin-bottom:14px}
  .sug .eyebrow{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:#b9a6ff;margin-bottom:9px}
  .sug .eyebrow svg{width:15px;height:15px;flex:0 0 auto}
  .sug .sgact{display:flex;gap:10px;justify-content:flex-end}
  .sgbtn{font-size:13.5px;font-weight:600;border-radius:22px;padding:9px 18px;border:none;cursor:pointer}
  .sgbtn.s{background:rgba(255,255,255,.14);color:#e9e9ea}
  .sgbtn.p{background:linear-gradient(135deg,#6d78f0,#9a6cf0);color:#fff}

  /* app grid + dock */
  .grid-area{margin-top:auto;padding:0 20px 6px}
  .appgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 18px;margin-bottom:12px}
  .app{display:flex;flex-direction:column;align-items:center;gap:6px}
  .app .ai{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.14);font-weight:700}
  .app .al{font-size:11px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.45);font-weight:500}
  .app .ai svg{width:30px;height:30px}
  .srch{display:flex;align-items:center;justify-content:center;gap:6px;margin:2px auto 14px;width:112px;height:30px;border-radius:20px;
    background:rgba(255,255,255,.28);backdrop-filter:blur(16px);color:#fff;font-size:12.5px}
  .dock{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;background:rgba(255,255,255,.26);backdrop-filter:blur(26px);
    border-radius:34px;padding:12px 16px;margin-bottom:8px}
  .dock .ai{width:56px;height:56px;border-radius:15px;display:flex;align-items:center;justify-content:center;margin:0 auto;box-shadow:0 4px 12px rgba(0,0,0,.14)}
  .dock .ai svg{width:32px;height:32px}
  .homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:120px;height:4.5px;border-radius:5px;background:rgba(255,255,255,.7);z-index:45}

  /* expanded detail */
  .detail{position:absolute;inset:0;z-index:50;background:#f4f4f6;display:flex;flex-direction:column;
    transform:translateY(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);overflow:hidden}
  .detail.open{transform:translateY(0)}
  .landing{position:absolute;inset:0;z-index:70;width:100%;height:100%;border:none;background:#f3f3f3;
    transform:translateY(100%);transition:transform .34s cubic-bezier(.4,0,.2,1)}
  .landing.open{transform:translateY(0)}
  .dnav{height:92px;display:flex;align-items:flex-end;gap:8px;padding:0 14px 8px;flex-shrink:0}
  .dnav .ib{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;color:#222}
  .dnav .sp{flex:1}
  .dbody{flex:1;overflow-y:auto;padding:4px 20px 96px;scrollbar-width:none}
  .dbody::-webkit-scrollbar{display:none}
  .dtitle{font-size:27px;font-weight:600;letter-spacing:-.5px;margin:2px 0 5px}
  .dsub{font-size:12.5px;color:var(--ink3);margin-bottom:16px}
  .tabs{display:flex;gap:8px;background:#e9e9ec;border-radius:22px;padding:4px;margin-bottom:18px}
  .tabs button{flex:1;border:none;background:transparent;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink3);
    padding:8px;border-radius:18px;cursor:pointer}
  .tabs button.on{background:#fff;color:#222;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .dsec{font-size:18px;font-weight:600;margin:22px 1px 12px}
  .dcard{background:#fff;border-radius:21px;padding:16px 17px;margin-bottom:12px}
  .dcard p{font-size:15px;line-height:1.75;color:#5c5c5c}
  .day{margin-bottom:16px}
  .day h4{font-size:15.5px;font-weight:650;margin-bottom:5px}
  .day h4 i{font-style:normal;color:var(--accent);margin-right:7px}
  .day p{font-size:14px;line-height:1.7;color:#6c6c6c}
  .dayimg{height:120px;border-radius:14px;margin-top:10px;background-size:cover;background-position:center;
    background-image:linear-gradient(120deg,#9fb7c9,#cdbfa6)}
  .fbar{position:absolute;bottom:0;left:0;right:0;display:flex;gap:12px;padding:12px 20px max(20px,env(safe-area-inset-bottom));
    background:#f4f4f6ee;backdrop-filter:blur(14px);border-top:1px solid #e7e7e7}
  .fbar button{flex:1;height:46px;border-radius:15px;border:none;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:7px}
  .fbar .ask{background:#fff;color:#444;flex:1.3}
  .fbar .add{background:#fff;color:#444}

  .toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);z-index:80;background:rgba(28,28,30,.93);color:#fff;
    font-size:13.5px;font-weight:500;padding:11px 18px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);white-space:nowrap;
    display:flex;align-items:center;gap:8px;animation:tin .2s ease}
  @keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

  /* stage switcher (demo chrome) */
  .stages{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:430px}
  .stages button{font-family:inherit;font-size:12px;font-weight:600;border:1px solid #2b313d;background:#161a22;color:#aeb6c6;
    border-radius:18px;padding:7px 13px;cursor:pointer}
  .stages button.on{background:var(--accent);border-color:var(--accent);color:#4a3600}
  .scenes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:470px;margin-top:2px}
  .scenes button{font-family:inherit;font-size:12.5px;font-weight:700;border:1px solid #333a48;background:#1b2130;color:#cdd4e2;
    border-radius:20px;padding:8px 15px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .scenes button .d{width:8px;height:8px;border-radius:50%}
  .scenes button.on{background:#fff;border-color:#fff;color:#12131a}

  @media(max-width:440px){
    body{padding:0;gap:0;background:#000}
    .cap,.stages{display:none}
    .device{width:100vw;height:100vh;border-radius:0;padding:0;box-shadow:none}
    .screen{border-radius:0}
    .screen .notch{display:none}
  }
</style>
</head>
<body>
<div class="cap">场景化 AI App · 负一屏（OS5）<span>一个场景一个 AI app · 上排切场景 · 下排切阶段 · 点卡片展开详情</span></div>

        <span class="batt">100</span>
      </span>
    </div>

    <!-- HOME / 负一屏 -->
    <div class="home" id="home">

        <div class="ctime">8:12</div>
      </div>
      <div class="aiwrap"><div id="aicard"></div></div>

    <div class="detail" id="detail">

        <span class="sp"></span>
        <button class="ib" aria-label="更多"><svg width="22" height="22" viewBox="0 0 24 24" fill="#222"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button>
      </div>
      <div class="dbody" id="dbody"></div>
      <div class="fbar">
        <button class="ask" id="askBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="#caa21a"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>问小爱</button>
        <button class="add" id="addBtn"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>添加内容</button>
      </div>
    </div>

    <iframe class="landing" id="landing" title="场景落地页"></iframe>
    <div class="homebar"></div>
  </div>
</div>

<div class="scenes" id="scenes"></div>
<div class="stages" id="stages"></div>

<script>

  '<div class="dsec" style="margin-top:4px">今天</div><div class="dcard"><div class="day"><h4><i>08:30</i>出门上班</h4><p>今天限行尾号 4，建议坐地铁 10 号线，约 35 分钟。</p></div><div class="day"><h4><i>10:00</i>产品评审会</h4><p>会议室 A302，6 人，资料已备好。</p></div><div class="day"><h4><i>15:00</i>接孩子放学</h4><p>阳光小学，提前 20 分钟提醒出发。</p></div><div class="day"><h4><i>16:30</i>牙医复诊</h4><p>口腔医院，别忘带医保卡。</p></div><div class="day"><h4><i>19:00</i>和小敏吃饭</h4><p>三里屯比目鱼火锅，已订位。</p></div></div>'},
};
const _raw=(location.hash||'').replace(/^#/,'');
const _open=/-open$/.test(_raw);
const _hs=_raw.replace(/-open$/,'').match(/^([a-z]+)(?:-s([0-9]))?$/);
let scene=(_hs&&APPS[_hs[1]])?_hs[1]:'today';
let cur=(_hs&&_hs[2]!==undefined)?+_hs[2]:defStage(scene), checkState={};
const cardEl=document.getElementById('aicard');
const toastT={id:null};
function toast(msg){const d=document.getElementById('detail');const host=d.classList.contains('open')?d:document.querySelector('.screen');
  let t=document.createElement('div');t.className='toast';t.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'+msg;
  host.appendChild(t);clearTimeout(toastT.id);toastT.id=setTimeout(()=>t.remove(),1900);}

function renderCard(){
 const s=APPS[scene][cur];const [ic,ib]=s.icon?TONE[s.itone]:['',''];
 let inner='';
 if(s.pin) inner+='<div class="pin"><span class="dot"></span>'+s.pin+'</div>';
 if(s.type==='sug'){
   cardEl.className='aicard sug';
   inner+='<div class="eyebrow">'+I.spark+' '+s.eyebrow+'</div>';
   inner+='<div class="aihd" style="margin-bottom:8px"><div class="ti"><b>'+s.title+'</b></div></div>';
   inner+='<div class="sgtext">'+s.text+'</div>';
   inner+='<div class="sgact"><button class="sgbtn s" data-stop>暂不</button><button class="sgbtn p" data-go>创建任务</button></div>';
 }else{
   cardEl.className='aicard';
   inner+='<div class="aihd"><span class="ic" style="color:#fff;background:'+ic+'">'+I[s.icon]+'</span><div class="ti"><b>'+s.title+'</b><s>'+s.sub+'</s></div><span class="more">展开</span></div>';
   inner+='<div class="aibody">';
   if(s.type==='check'){
     s.items.forEach((it,i)=>{const dn=checkState[scene+':'+cur+'#'+i];inner+='<div class="ck '+(dn?'done':'')+'" data-ck="'+i+'"><span class="box">'+(dn?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>':'')+'</span><span>'+it+'</span></div>';});
   }else{
     s.rows.forEach((r,i)=>{inner+='<div class="row">'+ric(r.ic,r.t)+'<div class="rc"><b>'+r.b+'</b><s>'+r.s+'</s></div>'+
       (r.btn?'<button class="rbtn y" data-btn="'+i+'">'+r.btn+'</button>':'<span class="rv'+(r.rv==='晴'?'':'')+'">'+r.rv+'</span>')+'</div>';});
   }
   inner+='</div>';
 }
 cardEl.innerHTML=inner;
 // interactions
 if(s.type!=='sug'){cardEl.onclick=(e)=>{if(e.target.closest('[data-ck]')||e.target.closest('[data-btn]'))return;openDetail();};}
 else cardEl.onclick=null;
 cardEl.querySelectorAll('[data-ck]').forEach(el=>el.onclick=()=>{const i=el.getAttribute('data-ck');const k=scene+':'+cur+'#'+i;checkState[k]=!checkState[k];renderCard();});
 cardEl.querySelectorAll('[data-btn]').forEach(el=>el.onclick=(e)=>{e.stopPropagation();const r=s.rows[+el.getAttribute('data-btn')];toast(r.btnToast||'已处理');});
 const go=cardEl.querySelector('[data-go]');if(go)go.onclick=()=>{cur=1;renderCard();renderStages();toast('已创建「稻城亚丁旅行」任务');};
 const stop=cardEl.querySelector('[data-stop]');if(stop)stop.onclick=()=>toast('已忽略，稍后可再创建');
}
function detailHTML(){
 const d=DETAIL[scene];
 if(d)return '<div class="dtitle">'+d.title+'</div><div class="dsub">'+d.sub+'</div><div class="tabs"><button class="on">'+d.tabs[0]+'</button><button>'+d.tabs[1]+'</button></div>'+d.body;
 const name=(SCENE.find(x=>x[0]===scene)||['','',''])[1];
 let h='<div class="dtitle">'+name+' · 全部</div><div class="dsub">这个场景的完整安排</div><div class="dcard">';
 APPS[scene].forEach(st=>{h+='<div class="day"><h4><i>'+st.k+'</i>'+(st.title||'')+'</h4>';
   if(st.rows)st.rows.forEach(r=>h+='<p>'+r.b+(r.s?'　·　'+r.s:'')+'</p>');
   if(st.items)st.items.forEach(it=>h+='<p>• '+it+'</p>');
   if(st.text)h+='<p>'+st.text+'</p>';
   h+='</div>';});
 return h+'</div>';
}
const LANDING={today:'../os5-today-ai-app/',course:'../os5-course-ai-app-figma/',travel:'../os5-travel-ai-app-figma/',commute:'../os5-commute-ai-app/',med:'../os5-clinic-ai-app/'};
function openDetail(){
 const lp=LANDING[scene];
 if(lp){const f=document.getElementById('landing');if(f.src.indexOf(lp)<0)f.src=lp;f.classList.add('open');return;}
 document.getElementById('dbody').innerHTML=detailHTML();document.getElementById('detail').classList.add('open');document.getElementById('home').classList.add('hide');}
function closeDetail(){document.getElementById('detail').classList.remove('open');document.getElementById('home').classList.remove('hide');}
function closeLanding(){const f=document.getElementById('landing');f.classList.remove('open');}
window.addEventListener('message',function(e){if(e.data==='close-landing')closeLanding();});
document.getElementById('back').onclick=closeDetail;
document.getElementById('askBtn').onclick=()=>toast('小爱：已根据这个场景为你整理好');
document.getElementById('addBtn').onclick=()=>toast('可以补充一条内容');
function renderStages(){const w=document.getElementById('stages');w.innerHTML=APPS[scene].map((s,i)=>'<button class="'+(i===cur?'on':'')+'" data-i="'+i+'">'+(i+1)+'. '+s.k+'</button>').join('');
 w.querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=+b.getAttribute('data-i');renderCard();renderStages();});}
function renderScenes(){const w=document.getElementById('scenes');w.innerHTML=SCENE.map(x=>'<button class="'+(x[0]===scene?'on':'')+'" data-s="'+x[0]+'"><span class="d" style="background:'+x[2]+'"></span>'+x[1]+'</button>').join('');
 w.querySelectorAll('button').forEach(b=>b.onclick=()=>{scene=b.getAttribute('data-s');cur=defStage(scene);closeLanding();closeDetail();renderScenes();renderStages();renderCard();});}
