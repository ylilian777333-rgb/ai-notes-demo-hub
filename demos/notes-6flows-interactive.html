<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, 'PingFang SC', 'SF Pro Display', sans-serif;
  background: #0a0a0f;
  color: #fff;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Header */
.header {
  padding: 32px 40px 24px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  backdrop-filter: blur(20px);
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10,10,15,0.9);
}
.header h1 {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 4px;
}
.header .meta {
  font-size: 13px;
  color: rgba(255,255,255,0.5);
}

/* Flow Tabs */
.flow-tabs {
  display: flex;
  gap: 8px;
  padding: 16px 40px;
  overflow-x: auto;
  background: rgba(10,10,15,0.95);
  position: sticky;
  top: 88px;
  z-index: 99;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.flow-tab {
  padding: 10px 20px;
  border-radius: 24px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.04);
  color: rgba(255,255,255,0.6);
}
.flow-tab:hover {
  background: rgba(255,255,255,0.08);
  color: #fff;
}
.flow-tab.active {
  background: #3b82f6;
  border-color: #3b82f6;
  color: #fff;
  box-shadow: 0 4px 16px rgba(59,130,246,0.3);
}

/* Demo Area */
.demo-container {
  padding: 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.flow-info {
  text-align: center;
  margin-bottom: 32px;
  max-width: 700px;
}
.flow-info h2 {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 8px;
}
.flow-info p {
  font-size: 14px;
  color: rgba(255,255,255,0.5);
  line-height: 1.6;
}
.flow-info .linan-tag {
  display: inline-block;
  background: rgba(245,158,11,0.15);
  color: #f59e0b;
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 12px;
  margin-top: 8px;
}

/* Phone Display */
.phone-stage {
  display: flex;
  align-items: center;
  gap: 32px;
  margin-bottom: 40px;
}
.phone-wrapper {
  position: relative;
}
.phone {
  width: 375px;
  height: 812px;
  border-radius: 54px;
  background: #fff;
  position: relative;
  overflow: hidden;
  box-shadow:
    0 0 0 12px #1a1a2e,
    0 0 0 14px rgba(255,255,255,0.1),
    0 40px 80px rgba(0,0,0,0.5);
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
.phone:hover {
  transform: scale(1.01);
}

/* Phone Internal */
.phone-screen {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}
.screen-content {
  position: absolute;
  inset: 0;
  opacity: 0;
  transform: translateX(30px);
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
}
.screen-content.active {
  opacity: 1;
  transform: translateX(0);
}
.screen-content.exit {
  opacity: 0;
  transform: translateX(-30px);
}

/* Status Bar */
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 28px 0;
  height: 50px;
  font-size: 14px;
  font-weight: 600;
  color: #1a1a1a;
}
.status-icons { font-size: 12px; letter-spacing: 2px; }

/* Nav Bar */
.nav-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 20px;
  height: 48px;
}
.nav-bar .back { font-size: 24px; color: #1a1a1a; cursor: pointer; }
.nav-bar .title { font-size: 17px; font-weight: 600; color: #1a1a1a; }
.nav-bar .action { font-size: 14px; color: #3b82f6; font-weight: 500; }

/* Content Area */
.content-area {
  flex: 1;
  padding: 0 20px;
  overflow-y: auto;
  color: #1a1a1a;
}

/* Tab Bar */
.tab-bar {
  display: flex;
  justify-content: space-around;
  padding: 10px 0 30px;
  border-top: 1px solid #f0f0f0;
  background: #fff;
}
.tab-bar span {
  font-size: 11px;
  color: #999;
  text-align: center;
}
.tab-bar span.active { color: #3b82f6; font-weight: 600; }

/* Common UI Elements */
.search-bar {
  background: #f5f5f7;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 15px;
  color: #999;
  margin-bottom: 16px;
}
.note-card {
  padding: 14px 0;
  border-bottom: 1px solid #f0f0f0;
}
.note-card h4 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.note-card p { font-size: 14px; color: #888; }
.note-card .tags { display: flex; gap: 6px; margin-top: 6px; }
.tag-chip {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 500;
}
.tag-chip.green { background: #ecfdf5; color: #059669; }
.tag-chip.blue { background: #eff6ff; color: #2563eb; }
.tag-chip.orange { background: #fff7ed; color: #d97706; }

.ai-bar {
  position: absolute;
  bottom: 80px;
  left: 16px;
  right: 16px;
  background: #fff;
  border: 1.5px solid #3b82f6;
  border-radius: 24px;
  padding: 12px 16px;
  font-size: 14px;
  color: #3b82f6;
  box-shadow: 0 -4px 20px rgba(59,130,246,0.1);
}

.output-cards {
  display: flex;
  gap: 8px;
  margin: 12px 0;
}
.output-card {
  flex: 1;
  padding: 12px 8px;
  border-radius: 12px;
  text-align: center;
  font-size: 12px;
  border: 1px solid #e5e5e5;
}
.output-card.done { background: #ecfdf5; border-color: #059669; }
.output-card.updating { background: #eff6ff; border-color: #3b82f6; }
.output-card.warn { background: #fff7ed; border-color: #f59e0b; }
.output-card .icon { font-size: 24px; margin-bottom: 4px; }
.output-card .label { font-weight: 600; }
.output-card .status { font-size: 11px; margin-top: 2px; }

.banner {
  padding: 10px 14px;
  border-radius: 10px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
}
.banner.warn { background: #fff7ed; color: #d97706; border: 1px solid #fde68a; }
.banner.success { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
.banner.info { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }

.progress-bar {
  height: 4px;
  background: #e5e5e5;
  border-radius: 2px;
  margin: 8px 0;
  overflow: hidden;
}
.progress-bar .fill {
  height: 100%;
  border-radius: 2px;
  transition: width 1.5s ease;
}
.progress-bar .fill.blue { background: #3b82f6; }
.progress-bar .fill.green { background: #059669; }

.timeline-item {
  padding: 12px 0;
  padding-left: 20px;
  border-left: 2px solid #e5e5e5;
  position: relative;
  margin-left: 6px;
}
.timeline-item::before {
  content: '';
  position: absolute;
  left: -5px;
  top: 16px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #3b82f6;
}
.timeline-item.done::before { background: #059669; }
.timeline-item.old::before { background: #d1d5db; }
.timeline-item .time { font-size: 12px; color: #999; }
.timeline-item .text { font-size: 15px; margin-top: 2px; }
.timeline-item .sub { font-size: 13px; color: #666; margin-top: 2px; }

.btn-primary {
  display: inline-block;
  padding: 10px 24px;
  background: #3b82f6;
  color: #fff;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  margin: 12px auto;
  cursor: pointer;
}
.btn-success {
  display: inline-block;
  padding: 10px 24px;
  background: #059669;
  color: #fff;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  margin: 12px auto;
}
.btn-warning {
  display: inline-block;
  padding: 10px 24px;
  background: #f59e0b;
  color: #fff;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 600;
  text-align: center;
}

/* Step Indicators */
.step-nav {
  display: flex;
  align-items: center;
  gap: 16px;
}
.step-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  cursor: pointer;
  transition: all 0.2s;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.6);
}
.step-btn:hover {
  background: rgba(255,255,255,0.12);
  color: #fff;
  transform: scale(1.1);
}
.step-btn:active { transform: scale(0.95); }
.step-btn.disabled {
  opacity: 0.3;
  pointer-events: none;
}

.step-dots {
  display: flex;
  gap: 6px;
  align-items: center;
}
.step-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  transition: all 0.3s;
}
.step-dot.active {
  width: 24px;
  border-radius: 4px;
  background: #3b82f6;
}

/* Screen Label */
.screen-label {
  text-align: center;
  margin-top: 20px;
}
.screen-label h3 {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 4px;
}
.screen-label p {
  font-size: 13px;
  color: rgba(255,255,255,0.5);
}
.screen-label .highlight {
  color: #f59e0b;
  font-weight: 600;
}

/* Recording Animation */
@keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.08);opacity:0.7} }
@keyframes wave { 0%,100%{height:8px} 50%{height:24px} }
.recording-circle {
  width: 80px; height: 80px; border-radius: 50%;
  background: #ef4444; display: flex; align-items: center; justify-content: center;
  font-size: 32px; margin: 0 auto 16px;
  animation: pulse 1.5s infinite;
}
.wave-bars { display: flex; align-items: center; justify-content: center; gap: 3px; height: 30px; margin: 12px 0; }
.wave-bars span {
  display: block; width: 3px; background: #ef4444; border-radius: 2px;
  animation: wave 0.8s ease-in-out infinite;
}
.wave-bars span:nth-child(2){animation-delay:0.1s}
.wave-bars span:nth-child(3){animation-delay:0.2s}
.wave-bars span:nth-child(4){animation-delay:0.3s}
.wave-bars span:nth-child(5){animation-delay:0.15s}
.wave-bars span:nth-child(6){animation-delay:0.25s}
.wave-bars span:nth-child(7){animation-delay:0.05s}

/* Animated Progress */
@keyframes progressAnim { 0%{width:0} 100%{width:65%} }
.progress-animated .fill { animation: progressAnim 2s ease forwards; }

/* PPT Dark Mode */
.ppt-viewer {
  background: #111;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.ppt-slide {
  width: 300px;
  aspect-ratio: 16/9;
  background: #fff;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}
.ppt-slide h3 { font-size: 20px; color: #1a1a1a; font-weight: 700; }
.ppt-slide p { font-size: 12px; color: #888; margin-top: 4px; }

/* Share Panel */
.share-panel {
  background: #fff;
  border-radius: 20px 20px 0 0;
  padding: 24px;
  margin-top: auto;
  box-shadow: 0 -8px 32px rgba(0,0,0,0.1);
}
.share-icons { display: flex; justify-content: space-around; margin: 16px 0; }
.share-icon { text-align: center; font-size: 11px; color: #666; }
.share-icon .circle {
  width: 48px; height: 48px; border-radius: 14px; margin: 0 auto 6px;
  display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff;
}

/* Guide Page */
.guide-center {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 30px;
  color: #1a1a1a;
}
.guide-center .icon { font-size: 64px; margin-bottom: 20px; }
.guide-center h3 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
.guide-center p { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 20px; }

.memory-list .item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 0; border-bottom: 1px solid #f0f0f0;
}
.memory-list .item .emoji { font-size: 20px; }
.memory-list .item .info h5 { font-size: 15px; font-weight: 600; }
.memory-list .item .info p { font-size: 12px; color: #999; }

/* Responsive */
@media (max-width: 768px) {
  .phone { width: 320px; height: 693px; border-radius: 46px; }
  .phone-stage { flex-direction: column; }
  .demo-container { padding: 20px; }
}
</style>
</head>

let currentFlow = 0;
let currentStep = 0;

function renderFlow() {
  const flow = flows[currentFlow];
  document.getElementById('flowInfo').innerHTML = `
    <h2>${flow.title}</h2>
    <p>${flow.desc}</p>
    ${flow.tag ? `<span class="linan-tag">${flow.tag}</span>` : ''}
  `;

  // Update tabs
  document.querySelectorAll('.flow-tab').forEach((tab, i) => {
    tab.classList.toggle('active', i === currentFlow);
  });

  currentStep = 0;
  renderStep();
}

function renderStep() {
  const flow = flows[currentFlow];
  const screen = flow.screens[currentStep];
  const phoneScreen = document.getElementById('phoneScreen');

  // Animate transition
  const existing = phoneScreen.querySelector('.screen-content.active');
  if (existing) {
    existing.classList.remove('active');
    existing.classList.add('exit');
    setTimeout(() => existing.remove(), 400);
  }

  const newScreen = document.createElement('div');
  newScreen.className = 'screen-content';
  newScreen.style.background = screen.html.includes('ppt-viewer') ? '#111' : '#fff';
  newScreen.innerHTML = screen.html;
  phoneScreen.appendChild(newScreen);
  requestAnimationFrame(() => newScreen.classList.add('active'));

  // Update label
  document.getElementById('screenLabel').innerHTML = `
    <h3>${screen.label}</h3>
    <p class="${screen.highlight ? 'highlight' : ''}">${screen.sub}</p>
  `;

  // Update dots
  const dots = document.getElementById('stepDots');
  dots.innerHTML = flow.screens.map((_, i) =>
    `<div class="step-dot ${i === currentStep ? 'active' : ''}"></div>`
  ).join('');

  // Update buttons
  document.getElementById('prevBtn').classList.toggle('disabled', currentStep === 0);
  document.getElementById('nextBtn').classList.toggle('disabled', currentStep === flow.screens.length - 1);
}

function nextStep() {
  const flow = flows[currentFlow];
  if (currentStep < flow.screens.length - 1) {
    currentStep++;
    renderStep();
  }
}

function prevStep() {
  if (currentStep > 0) {
    currentStep--;
    renderStep();
  }
}

// Tab clicks
document.querySelectorAll('.flow-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    currentFlow = parseInt(tab.dataset.flow);
    renderFlow();
  });
});

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') nextStep();
  if (e.key === 'ArrowLeft') prevStep();
});

// Init
renderFlow();
</script>
