<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>合集 · 对比稿</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"MiSans","PingFang SC",-apple-system,sans-serif;background:#F7F8FA;color:#1B2033;-webkit-font-smoothing:antialiased}
.wrap{max-width:1360px;margin:0 auto;padding:0 72px}
.hero{padding:56px 0 30px}
.hero .eb{font-size:12px;letter-spacing:.18em;color:#2E5BFF;font-weight:600;margin-bottom:12px}
.hero h1{font-size:34px;font-weight:700;letter-spacing:-.4px}
.hero .lead{margin-top:14px;font-size:14.5px;line-height:1.85;color:#4A5468;max-width:860px}
.hero .lead b{color:#1B2033;font-weight:600}
.hero .meta{margin-top:20px;font-size:12px;color:#98A0B2}

.sec{background:#fff;border:1px solid #EAEDF3;border-radius:18px;padding:32px 34px;margin-bottom:22px}
.sec-top{display:flex;gap:18px;align-items:flex-start;margin-bottom:20px}
.snum{font-size:30px;font-weight:700;color:#C9D3F5;line-height:1;min-width:40px}
.sec h2{font-size:22px;font-weight:700;letter-spacing:-.2px}
.sec .sd{margin-top:9px;font-size:13.5px;line-height:1.8;color:#4A5468;max-width:880px}
.quote{margin-top:12px;font-size:12.5px;color:#8A93A6;border-left:2px solid #DCE0E9;padding-left:12px;line-height:1.7}

.cmp{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:8px}
.cmp .col .tag{font-size:11px;font-weight:600;letter-spacing:.05em;padding:4px 10px;border-radius:6px;display:inline-block;margin-bottom:12px}
.cmp .col.now .tag{background:#F3F4F7;color:#8A93A6}
.cmp .col.next .tag{background:#EAF0FF;color:#2E5BFF}
.cmp .col .note{margin-top:12px;font-size:12.5px;line-height:1.8;color:#6B7280}
.cmp .col .note u{text-decoration:none;color:#C6392F;font-weight:600}
.cmp .col .note.g u{color:#0F7A5A}
.center{display:flex;justify-content:center}

.rail{display:flex;align-items:flex-start;gap:0;overflow:hidden;margin-top:6px}
.rail .st{flex:0 0 214px;width:214px}
.rail .ar{flex:1 1 auto;text-align:center;color:#C3CAD8;font-size:16px;align-self:center;min-width:16px}
.st .sh{display:flex;align-items:center;gap:6px;margin-bottom:9px;flex-wrap:wrap}
.st .sn{font-size:10px;font-weight:700;color:#fff;background:#B9C2D4;border-radius:4px;padding:2px 5px}
.st .stt{font-size:12px;font-weight:600}
.st .cap{margin-top:9px;font-size:11.5px;line-height:1.7;color:#7E8898}

/* 手机帧 */
.ph{width:214px;background:#fff;border:1px solid #E1E5EC;border-radius:22px;overflow:hidden;position:relative;font-size:10px;color:#1B2033}
.ph.g{background:#F7F8FA}
.ph .bar{height:0}
.sb{height:20px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:8.5px;color:#98A0B2}
.nav{display:flex;align-items:center;gap:6px;padding:5px 11px 3px}
.nav .bk{font-size:11px;color:#4A5468}
.nav .tt{font-size:12.5px;font-weight:600;flex:1}
.nav .ow{font-size:8.5px;font-weight:600;padding:2px 7px;border-radius:9px}
.ow.f{background:#E7EDFF;color:#2E5BFF}.ow.c{background:#E2F3EA;color:#128A5B}.ow.a{background:#EFE9FF;color:#6B4BD6}.ow.p{background:#FFEFE0;color:#D9772B}
.srch{margin:4px 11px 8px;height:26px;border-radius:13px;background:#F1F2F5;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:9px;color:#A6ADBB}
.srch .ai{width:13px;height:13px;border-radius:50%;background:conic-gradient(from 90deg,#3D5BFD,#FFA1A1,#9289FF)}
.bd{padding:0 11px}

/* 相册回忆式：分栏 + 横滑封面 */
.strip{margin-bottom:13px}
.strip .sh2{display:flex;align-items:baseline;justify-content:space-between;margin:0 1px 7px}
.strip .sh2 b{font-size:11.5px}
.strip .sh2 i{font-style:normal;font-size:8.5px;color:#A6ADBB}
.covs{display:flex;gap:8px;overflow:hidden}
.cov{flex:0 0 116px;width:116px;border-radius:12px;overflow:hidden;border:1px solid #ECEEF3}
.cov .top{height:64px;padding:9px 10px;position:relative}
.cov .top b{font-size:11px;font-weight:600;line-height:1.3;display:block}
.cov .top .chip{position:absolute;left:10px;bottom:8px;font-size:8px;font-weight:600;padding:2px 7px;border-radius:8px;background:rgba(255,255,255,.75)}
.cov .bt{padding:7px 10px 9px;background:#fff}
.cov .bt .l{font-size:8.5px;color:#6B7280;line-height:1.5}
.cov .bt .m{font-size:8px;color:#A6ADBB;margin-top:3px}
.cov.mini{flex:0 0 92px;width:92px}
.cov.mini .top{height:52px}
.cov .peek{flex:0 0 26px}
.tint-f{background:linear-gradient(135deg,#E7EDFF,#F3F6FF)}
.tint-c{background:linear-gradient(135deg,#E2F3EA,#F1FAF5)}
.tint-a{background:linear-gradient(135deg,#EFE9FF,#F6F2FF)}
.tint-p{background:linear-gradient(135deg,#FFEFE0,#FFF7F0)}
.tint-y{background:linear-gradient(135deg,#FFF3D6,#FFFAEC)}
.tint-g{background:#F1F2F5}
.dashcov{flex:0 0 116px;width:116px;height:118px;border:1.5px dashed #D3D8E2;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#A6ADBB;font-size:9px;text-align:center;padding:0 10px;line-height:1.5}

/* 现状：状态卡宫格 */
.gcards{display:flex;gap:8px}
.gc{flex:1;background:#fff;border:1px solid #ECEEF3;border-radius:11px;padding:9px;min-height:118px}
.gc .h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.gc .h b{font-size:10.5px}.gc .h i{font-style:normal;font-size:8px;color:#A6ADBB}
.gc .r{display:flex;align-items:center;gap:5px;margin-bottom:5px}
.gc .r .bx{width:8px;height:8px;border:1px solid #C3CAD8;border-radius:2px;flex:0 0 8px}
.gc .r span{font-size:8.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
.gc .r em{font-style:normal;font-size:7.5px;color:#A6ADBB}
.gc .cl{display:flex;justify-content:space-between;font-size:8.5px;margin-bottom:6px;color:#3C4658}
.gc .cl em{font-style:normal;font-size:7.5px;color:#A6ADBB}

/* 待办 / 列表 / 卡片 */
.todo{padding:5px 1px}
.todo .g{font-size:9px;color:#A6ADBB;margin:6px 0 4px}
.trow{display:flex;align-items:flex-start;gap:6px;padding:5px 1px;border-bottom:1px solid #F2F4F8}
.trow .bx{width:9px;height:9px;border:1.2px solid #C3CAD8;border-radius:2px;flex:0 0 9px;margin-top:1px}
.trow .tx{flex:1;font-size:9.5px}
.trow .tx i{font-style:normal;display:block;font-size:8px;color:#B0B7C5;margin-top:1px}
.trow .mt{font-size:8px;color:#A6ADBB;flex:0 0 auto;padding-top:1px}
.card{background:#fff;border:1px solid #ECEEF3;border-radius:10px;padding:9px 10px;margin-bottom:7px}
.card .ch{font-size:10.5px;font-weight:600;margin-bottom:3px}
.card .cs{font-size:8.5px;color:#A6ADBB;margin-bottom:6px}
.card .kv{display:flex;justify-content:space-between;font-size:9px;padding:3px 0;border-top:1px solid #F4F6F9}
.card .kv:first-of-type{border-top:0}.card .kv i{font-style:normal;color:#A6ADBB}
.seg{display:flex;gap:6px;margin:7px 0}
.seg b{flex:1;text-align:center;font-size:9.5px;font-weight:500;padding:7px 0;border-radius:8px;background:#F1F2F5;color:#4A5468}
.seg b.on{background:#2E5BFF;color:#fff}
.tabs{display:flex;gap:12px;padding:0 1px 6px;border-bottom:1px solid #EEF0F4;margin:2px 0 7px}
.tabs b{font-size:10px;color:#A6ADBB;font-weight:500;padding-bottom:4px}
.tabs b.on{color:#1B2033;border-bottom:1.5px solid #2E5BFF}
.li{background:#fff;border:1px solid #ECEEF3;border-radius:9px;padding:7px 9px;margin-bottom:5px}
.li b{font-size:9.5px;font-weight:600;display:block;margin-bottom:2px}
.li p{font-size:8.5px;line-height:1.55;color:#8A93A6}.li em{font-style:normal;font-size:8px;color:#B8BFCB;display:block;margin-top:3px}
.sl{font-size:9px;color:#A6ADBB;margin:8px 1px 5px}

/* 对谈 */
.mount{display:inline-block;font-size:8.5px;padding:3px 9px;border-radius:10px;background:#E7EDFF;color:#2E5BFF;font-weight:600;margin:2px 0 7px}
.bub{max-width:90%;font-size:9px;line-height:1.6;padding:7px 9px;border-radius:9px;margin-bottom:6px;background:#F4F6FA;color:#3C4658}
.bub.me{background:#2E5BFF;color:#fff;margin-left:auto}
.qchips{display:flex;flex-direction:column;gap:5px;margin-top:4px}
.qchips b{font-size:8.5px;font-weight:500;padding:6px 9px;border-radius:8px;background:#fff;border:1px solid #E4E8EF;color:#4A5468}
.mini-in{margin-top:7px;height:26px;border-radius:13px;background:#F1F2F5;display:flex;align-items:center;padding:0 10px;font-size:8.5px;color:#A6ADBB}

/* 锁屏 / 通知 / 波形 */
.lock{background:linear-gradient(165deg,#E6ECF7,#EEF1F8 55%,#F5F6FA);padding:26px 11px 0;min-height:300px}
.lock .tm{text-align:center;font-size:30px;font-weight:600;color:#3C4658;letter-spacing:-1px}
.lock .dt{text-align:center;font-size:9px;color:#8A93A6;margin-bottom:14px}
.notif{background:rgba(255,255,255,.9);border-radius:11px;padding:8px 9px;margin-bottom:6px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.notif .na{font-size:8px;color:#A6ADBB;margin-bottom:2px}
.notif b{font-size:9.5px;display:block;margin-bottom:2px}.notif p{font-size:8.5px;line-height:1.5;color:#6B7280}
.wave{display:flex;align-items:flex-end;gap:1.5px;height:26px;margin:8px 0}
.wave i{flex:1;background:#C7D3F7;border-radius:1px}
.rec{display:flex;align-items:center;gap:5px;font-size:9px;color:#C6392F;font-weight:600;margin-bottom:2px}
.rec u{width:5px;height:5px;border-radius:50%;background:#C6392F}
.ftxt{font-size:9px;color:#A6ADBB;text-align:center;padding:6px 0}
.thumb{height:78px;border-radius:9px;background:linear-gradient(135deg,#EEF1F7,#F6F8FB);display:flex;align-items:center;justify-content:center;font-size:9px;color:#A6ADBB;margin:6px 0}
.tb{display:flex;align-items:center;justify-content:space-around;padding:7px 14px 9px;border-top:1px solid #EEF0F4;margin-top:8px}
.tb span{font-size:9px;color:#A6ADBB}.tb span.on{color:#1B2033;font-weight:600}
.tb u{width:19px;height:19px;border-radius:50%;background:#2E5BFF;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px}
.calrow{display:flex;gap:7px;margin:6px 0}
.calrow i{flex:1;font-style:normal;text-align:center;font-size:8px;color:#A6ADBB;padding:5px 0;border-radius:7px;background:#F4F6F9}
.calrow i.on{background:#2E5BFF;color:#fff}

/* 差异表 */
table{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}
th{text-align:left;font-size:11.5px;font-weight:600;color:#8A93A6;padding:10px 12px;background:#F6F7FA;border-bottom:1px solid #EAEDF3}
td{padding:12px;border-bottom:1px solid #F0F2F6;line-height:1.75;color:#4A5468;vertical-align:top;font-size:12.5px}
td b{color:#1B2033}td .now{color:#8A93A6}td .nx{color:#0F7A5A;font-weight:600}
footer{padding:26px 0 56px;font-size:11.5px;color:#B8BFCB}
</style>
</head>
<body>
<div class="wrap">
<div class="hero">
  <div class="eb">OS5 · 笔记 · 对比稿</div>
  <h1>合集</h1>
  <p class="lead">这是「合集」这个 tab 的对比稿，<b>只放对着现稿要改的几处，原稿不动</b>。核心一句话：合集页不做成状态卡的信息聚合，做成相册回忆那样——按品类分栏、栏内横向滑动，每一个单元是一件能直接消费的成品。下面把首页、空的时候、进一个单元、学习备考整条链，逐个和现稿摆一起看。</p>
  <p class="meta">2026-09-10 ｜ 依据 9/10 两次沟通（13:04 框架会 + 14:10 补充会）｜ 内容助手</p>
</div>
<div id="root"></div>
<footer>合集 · 对比稿 · 2026-09-10 ｜ 与《OS5 笔记·产品方案框架》配套，原稿不动</footer>
</div>

<script>
function ph(inner,gray){return '<div class="ph'+(gray?' g':'')+'">'+inner+'<div class="bar"></div></div>'}
function sb(){return '<div class="sb"><span>9:41</span><span>••••</span></div>'}
function nav(t,o){var ow=o?'<span class="ow '+o.k+'">'+o.t+'</span>':'';return '<div class="nav">'+(t.bk?'<span class="bk">‹ '+t.bk+'</span>':'')+'<span class="tt">'+t.t+'</span>'+ow+'</div>'}
function srch(){return '<div class="srch"><span>搜索笔记</span><span class="ai"></span></div>'}
function tb(a){return '<div class="tb"><span class="'+(a==0?'on':'')+'">合集</span><u>＋</u><span class="'+(a==1?'on':'')+'">笔记</span></div>'}
function cov(c){return '<div class="cov'+(c.mini?' mini':'')+'"><div class="top tint-'+c.tint+'"><b>'+c.t+'</b><span class="chip">'+c.chip+'</span></div><div class="bt"><div class="l">'+c.l+'</div><div class="m">'+c.m+'</div></div></div>'}
function strip(s){return '<div class="strip"><div class="sh2"><b>'+s.t+'</b><i>'+s.i+'</i></div><div class="covs">'+s.covs.map(cov).join('')+'<div class="peek"></div></div></div>'}
function scr(s){var o=s.o?'<span class="ow '+s.o.k+'">'+s.o.t+'</span>':'';return '<div class="st"><div class="sh"><span class="sn">'+s.n+'</span><span class="stt">'+s.t+'</span>'+o+'</div>'+ph(s.h,s.g)+'<div class="cap">'+s.cap+'</div></div>'}
function rail(list){return '<div class="rail">'+list.map(scr).join('<div class="ar">→</div>')+'</div>'}

/* ===== 屏 ===== */
// 现状：状态卡宫格
var HOME_NOW = sb()+nav({t:'笔记'})+srch()
 +'<div class="bd"><div class="gcards">'
 +'<div class="gc"><div class="h"><b>待办</b><i>15项</i></div>'
   +'<div class="r"><span class="bx"></span><span>给植物浇水</span><em>今天</em></div>'
   +'<div class="r"><span class="bx"></span><span>就诊复查</span><em>今天</em></div>'
   +'<div class="r"><span class="bx"></span><span>给老王发方案</span><em>周五</em></div>'
   +'<div class="r"><span class="bx"></span><span>大扫除</span><em>明天</em></div></div>'
 +'<div class="gc"><div class="h"><b>课程</b><i>15科</i></div>'
   +'<div class="cl"><span>大学物理</span><em>6课</em></div>'
   +'<div class="cl"><span>高等数学1</span><em>12课</em></div>'
   +'<div class="cl"><span>管理学理论</span><em>3课</em></div>'
   +'<div class="cl"><span>量子算法</span><em>2课</em></div></div></div>'
 +'<div class="gcards" style="margin-top:8px">'
 +'<div class="gc"><div class="h"><b>卡包</b><i>8张</i></div>'
   +'<div class="cl"><span>身份证</span><em></em></div><div class="cl"><span>银行卡</span><em></em></div><div class="cl"><span>护照</span><em></em></div></div>'
 +'<div class="gc"><div class="h"><b>本月支出</b><i></i></div><div style="font-size:15px;font-weight:600;margin-top:4px">¥2911</div><div style="height:40px;display:flex;align-items:flex-end;gap:3px;margin-top:8px">'
   +[30,60,45,80,35,55].map(function(v){return '<i style="flex:1;background:#DCE3F2;height:'+v+'%;border-radius:1px"></i>'}).join('')+'</div></div></div></div>'
 +tb(0);

// 改后：相册回忆式
var HOME_NEW = sb()+nav({t:'合集'})+srch()
 +'<div class="bd">'
 +strip({t:'待办日程',i:'今天 4 · 顺延 2',covs:[
    {t:'今天要做的',tint:'f',chip:'日程',l:'4 件 · 2 件带时间',m:'顺延 2 件'},
    {t:'本周',tint:'f',chip:'日程',l:'11 件',m:'3 件已排到人'}]})
 +strip({t:'学习备考',i:'6 门课',covs:[
    {t:'大学物理',tint:'c',chip:'精讲',l:'6 堂 · 四类来源齐',m:'考前 2 天'},
    {t:'高等数学1',tint:'c',chip:'出卷',l:'12 堂',m:'上次自测 17/20'},
    {t:'管理学理论',tint:'c',chip:'快讲',l:'3 堂',m:''}]})
 +strip({t:'想法随记',i:'工作 / 生活 / 兴趣',covs:[
    {t:'排期与人力',tint:'a',chip:'对谈',l:'24 条 · 今天更新',m:'反复出现 5 次'},
    {t:'西安访谈',tint:'a',chip:'纪要',l:'7 场',m:'3 人提到同一点'},
    {t:'钓鱼',tint:'p',chip:'合辑',l:'12 条',m:''}]})
 +'</div>'+tb(0);

// 空态
var HOME_EMPTY = sb()+nav({t:'合集'})+srch()
 +'<div class="bd">'
 +strip({t:'待办日程',i:'今天 2',covs:[
    {t:'今天要做的',tint:'f',chip:'日程',l:'2 件 · 记一条就成立',m:'刚记的也在'}]})
 +'<div class="strip"><div class="sh2"><b>学习备考</b><i>还没有</i></div><div class="covs">'
   +'<div class="dashcov">记满两三堂课<br>这里长出第一门课</div><div class="peek"></div></div></div>'
 +'<div class="strip"><div class="sh2"><b>想法随记</b><i>还没有</i></div><div class="covs">'
   +'<div class="dashcov">同一件事记够几条<br>自动成一个合集</div><div class="peek"></div></div></div>'
 +'<div class="ftxt" style="margin-top:10px">合集是长出来的：记得越多，这页越满。空着不摆假卡片。</div>'
 +'</div>'+tb(0);

// 进一门课（成品首屏）
var UNIT_COURSE = sb()+nav({t:'大学物理',bk:'合集'},{k:'f',t:'笔记'})
 +'<div class="bd"><div class="ftxt" style="text-align:left;padding:4px 1px">6 堂 · 四类来源已齐 · 考前 2 天</div>'
 +'<div class="seg"><b class="on">精讲</b><b>快讲</b><b>出一套卷</b></div>'
 +'<div class="tabs"><b class="on">考点大纲</b><b>按章节</b><b>原始资料</b></div>'
 +'<div class="card"><div class="ch">第三章 刚体转动 · 考点 6</div>'
   +'<div class="kv"><i>转动惯量的计算</i><span>真题 3 次</span></div>'
   +'<div class="kv"><i>合外力矩与角加速度</i><span>真题 4 次</span></div>'
   +'<div class="kv"><i>角动量守恒</i><span>真题 2 次</span></div></div>'
 +'<div class="li"><b>原始资料</b><p>录音 6 · 课件 6 · 教材 1 · 真题 3</p><em>退到这里，要看随时点</em></div>'
 +'</div>'+tb(0);

// 进一个工作想法（对谈首屏）
var UNIT_IDEA = sb()+nav({t:'排期与人力',bk:'合集'},{k:'f',t:'笔记'})
 +'<div class="bd"><span class="mount">＋ 已挂载这个合集 24 条</span>'
 +'<div class="bub">这一个月你反复说排期被临时需求打断。要不要一起把插需求的口子怎么收，理成下一步？</div>'
 +'<div class="qchips"><b>这些打断都来自哪里</b><b>上次说的两个二级需求砍了吗</b><b>帮我理一份收口方案</b></div>'
 +'<div class="sl">下面是这个合集里 AI 看到的</div>'
 +'<div class="card"><div class="ch">反复出现的两处</div><div class="kv"><i>插需求没有统一入口</i><span>5 次</span></div><div class="kv"><i>人力缺口集中在同一环</i><span>4 次</span></div></div>'
 +'<div class="mini-in">接着聊，或换个问题…</div>'

function render(s){
  var h='<div class="sec"><div class="sec-top"><div class="snum">'+s.n+'</div><div><h2>'+s.t+'</h2>'
    +(s.sd?'<p class="sd">'+s.sd+'</p>':'')+(s.quote?'<div class="quote">'+s.quote+'</div>':'')+'</div></div>';
  if(s.cmp){h+='<div class="cmp"><div class="col now"><span class="tag">'+s.cmp.now.tag+'</span><div class="center">'+ph(s.cmp.now.h,s.cmp.now.g)+'</div><p class="note">'+s.cmp.now.note+'</p></div>'
    +'<div class="col next"><span class="tag">'+s.cmp.next.tag+'</span><div class="center">'+ph(s.cmp.next.h,s.cmp.next.g)+'</div><p class="note g">'+s.cmp.next.note+'</p></div></div>';}
  if(s.single){h+='<div class="center" style="gap:26px;align-items:flex-start">'+ph(s.single,1)+'<div style="max-width:300px;align-self:center;font-size:12.5px;line-height:1.85;color:#6B7280">'+s.singleCap+'</div></div>';}
  if(s.two){h+='<div class="center" style="gap:34px">'+s.two.map(function(x){return '<div style="text-align:center"><div style="font-size:12px;font-weight:600;margin-bottom:10px;color:#4A5468">'+x.t+'</div>'+ph(x.h,1)+'</div>'}).join('')+'</div>';}
  if(s.chain){h+=rail(s.chain);}
  if(s.plain){h+='<div style="background:#F3FBF7;border:1px solid #D6EEE1;border-radius:12px;padding:18px 20px;font-size:14px;line-height:2;color:#2A4A3C">'+s.plain+'</div>';}
  if(s.table){h+='<table><thead><tr><th style="width:130px">这一处</th><th>现稿</th><th>这版</th><th style="width:230px">依据</th></tr></thead><tbody>'
    +s.table.map(function(r){return '<tr><td><b>'+r[0]+'</b></td><td class="now">'+r[1]+'</td><td class="nx">'+r[2]+'</td><td>'+r[3]+'</td></tr>'}).join('')+'</tbody></table>';}
  return h+'</div>';
}
