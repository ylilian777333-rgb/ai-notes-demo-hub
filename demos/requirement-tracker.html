    { name: "录音画需求跳笔记", time: "OS4交付不确定", owner: "-", progress: "-", eta: "-", risk: "", ai: "", conclusion: "-" },
  ]},
  { group: "功能适配", items: [
    { name: "负一屏搜索", time: "OS4交付不确定", owner: "-", progress: "-", eta: "-", risk: "", ai: "", conclusion: "-" },
    { name: "新建笔记/小组件", time: "OS4交付不确定", owner: "-", progress: "-", eta: "-", risk: "", ai: "", conclusion: "-" },
    { name: "书签文件夹", time: "OS4交付不确定", owner: "-", progress: "-", eta: "-", risk: "", ai: "", conclusion: "-" },
    { name: "置顶文件夹", time: "OS4交付不确定", owner: "-", progress: "-", eta: "-", risk: "", ai: "", conclusion: "-" },
    { name: "图片拖动排序", time: "OS4交付不确定", owner: "-", progress: "-", eta: "-", risk: "", ai: "", conclusion: "-" },
  ]},
  { group: "前端", items: [
    { name: "Markdown风格快速输入", time: "OS4交付不确定", owner: "-", progress: "-", eta: "-", risk: "", ai: "", conclusion: "-" },
    { name: "字体大小/设置", time: "OS4交付不确定", owner: "-", progress: "-", eta: "-", risk: "", ai: "", conclusion: "-" },
  ]},
];

const EDITABLE_COLS = [1, 3, 4, 5, 8]; // name, owner, progress, eta, conclusion (0-indexed within item cols)
const STORAGE_KEY = 'req-tracker-data';

function getTimeTag(time) {
  if (!time || time === '-') return '-';
  if (time.includes('P0')) return `<span class="tag tag-p0">${time}</span>`;
  if (time.includes('P1')) return `<span class="tag tag-p1">${time}</span>`;
  if (time.includes('P2')) return `<span class="tag tag-p2">${time}</span>`;
  if (time.includes('HC')) return `<span class="tag tag-hc">${time}</span>`;
  if (time.includes('OS4交付不确定')) return `<span class="tag tag-unsure">${time}</span>`;
  return time;
}

function loadSaved() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      parsed.forEach((group, gi) => {
        if (DATA[gi]) {
          group.items.forEach((item, ii) => {
            if (DATA[gi].items[ii]) {
              Object.assign(DATA[gi].items[ii], item);
            }
          });
        }
      });
    }
  } catch(e) {}
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA.map(g => ({
    items: g.items.map(item => ({
      name: item.name, owner: item.owner, progress: item.progress,
      eta: item.eta, conclusion: item.conclusion
    }))
  }))));
}

function renderTable() {
  const tbody = document.getElementById('tracker-body');
  tbody.innerHTML = '';
  let rowIndex = 0;
  DATA.forEach((group, gi) => {
    const groupRow = document.createElement('tr');
    groupRow.className = 'group-row';
    groupRow.innerHTML = `<td colspan="8">${group.group}</td>`;
    tbody.appendChild(groupRow);
    group.items.forEach((item, ii) => {
      const tr = document.createElement('tr');
      tr.dataset.gi = gi;
      tr.dataset.ii = ii;
      tr.innerHTML = `
        <td class="editable" data-field="name"><span class="edit-marker"></span>${item.name}</td>
        <td>${getTimeTag(item.time)}</td>
        <td class="editable" data-field="owner"><span class="edit-marker"></span>${item.owner}</td>
        <td class="editable" data-field="progress"><span class="edit-marker"></span>${item.progress}</td>
        <td class="editable" data-field="eta"><span class="edit-marker"></span>${item.eta}</td>
        <td class="risk-cell" data-field="risk">${item.risk ? renderRisk(item.risk) : ''}</td>
        <td class="ai-cell" data-field="ai">${item.ai ? `<span class="ai-suggestion">${item.ai}</span>` : ''}</td>
        <td class="editable" data-field="conclusion"><span class="edit-marker"></span>${item.conclusion}</td>
      `;
      tbody.appendChild(tr);
      rowIndex++;
    });
  });
  attachEditListeners();
}

function renderRisk(risk) {
  if (!risk) return '';
  if (risk.includes('高风险')) return `<span class="risk-high">${risk}</span>`;
  if (risk.includes('中风险')) return `<span class="risk-mid">${risk}</span>`;
  if (risk.includes('低风险')) return `<span class="risk-low">${risk}</span>`;
  return risk;
}

function attachEditListeners() {
  document.querySelectorAll('td.editable').forEach(td => {
    td.addEventListener('dblclick', function() {
      if (td.querySelector('input, textarea')) return;
      const field = td.dataset.field;
      const tr = td.closest('tr');
      const gi = parseInt(tr.dataset.gi);
      const ii = parseInt(tr.dataset.ii);
      const currentVal = DATA[gi].items[ii][field] || '';
      const marker = td.querySelector('.edit-marker');
      td.innerHTML = '';
      if (marker) td.appendChild(marker);
      const input = document.createElement('input');
      input.type = 'text';
      input.value = currentVal === '-' ? '' : currentVal;
      td.appendChild(input);
      input.focus();
      input.select();
      const save = () => {
        const newVal = input.value.trim() || '-';
        DATA[gi].items[ii][field] = newVal;
        td.innerHTML = `<span class="edit-marker"></span>${newVal}`;
        td.classList.add('modified');
        saveData();
      };
      input.addEventListener('keydown', e => { if (e.key === 'Enter') { save(); } });
      input.addEventListener('blur', save);
    });
  });
}

function assessRisk(item) {
  const time = item.time || '';
  const progress = item.progress || '';
  const risk = item.risk || '';
  // Has 入力缺口
  if (risk.includes('入力缺口') || progress.includes('入力缺口') || progress.includes('入口缺口')) {
    return { level: 'high', label: '🔴 高风险' };
  }
  // HC-需要确认排期
  if (time.includes('HC')) {
    return { level: 'high', label: '🔴 高风险' };
  }
  // P0 5.28
  if (time.includes('P0')) {
    const doneKeywords = ['已合入', '已进版', '已外发', '已完成', '已支持', 'Q1已交付'];
    const progressKeywords = ['开发中', '进行中', '建新中', '迁移到pad', '进度'];
    if (doneKeywords.some(k => progress.includes(k))) {
      return { level: 'low', label: '🟢 低风险' };
    }
    if (progressKeywords.some(k => progress.includes(k))) {
      return { level: 'mid', label: '🟡 中风险' };
    }
    // P0 with no progress or empty
    if (!progress || progress === '-' || progress.includes('虚')) {
      return { level: 'high', label: '🔴 高风险' };
    }
    return { level: 'mid', label: '🟡 中风险' };
  }
  // OS4交付不确定
  if (time.includes('OS4交付不确定')) {
    return { level: 'mid', label: '🟡 中风险' };
  }
  // P1
  if (time.includes('P1')) {
    return { level: 'low', label: '🟢 低风险' };
  }
  return { level: 'low', label: '🟢 低风险' };
}

function generateSuggestion(item, riskResult) {
  const time = item.time || '';
  const progress = item.progress || '';
  const risk = item.risk || '';
  // Done
  const doneKeywords = ['已合入', '已进版', '已外发', '已完成', '已支持', 'Q1已交付', '已日更外发'];
  if (doneKeywords.some(k => progress.includes(k))) {
    return '✅ 已完成';
  }
  if (riskResult.level === 'high') {
    if (risk.includes('入力缺口') || progress.includes('入力缺口') || progress.includes('入口缺口')) {
      return '🆘 需协调资源，入力缺口阻塞';
    }
    if (time.includes('HC')) {
      return '📞 需确认排期，阻塞决策';
    }
    if (time.includes('P0')) {
      return '⚡ 最高优先级，需立即推进';
    }
    return '⚡ 最高优先级，需立即推进';
  }
  if (riskResult.level === 'mid') {
    if (time.includes('OS4交付不确定')) {
      return '🤔 需PM决策：做/砍/延';
    }
    if (progress.includes('开发中') || progress.includes('进行中') || progress.includes('建新中')) {
      return '👀 跟进交付，关注时间线';
    }
    return '👀 跟进交付，关注时间线';
  }
  return '✅ 正常推进';
}

async function runAIAnalysis() {
  const btn = document.querySelector('.ai-btn');
  btn.disabled = true;
  btn.textContent = '🤖 分析中...';
  const rows = document.querySelectorAll('#tracker-body tr:not(.group-row)');
  let highCount = 0, midCount = 0, lowCount = 0;
  for (let i = 0; i < rows.length; i++) {
    const tr = rows[i];
    const gi = parseInt(tr.dataset.gi);
    const ii = parseInt(tr.dataset.ii);
    const item = DATA[gi].items[ii];
    // Scan animation
    const riskCell = tr.querySelector('.risk-cell');
    const aiCell = tr.querySelector('.ai-cell');
    tr.style.position = 'relative';
    const scanLine = document.createElement('div');
    scanLine.className = 'scan-line';
    tr.appendChild(scanLine);
    await new Promise(r => setTimeout(r, 80));
    scanLine.remove();
    // Assess
    const riskResult = assessRisk(item);
    const suggestion = generateSuggestion(item, riskResult);
    if (riskResult.level === 'high') highCount++;
    else if (riskResult.level === 'mid') midCount++;
    else lowCount++;
    // Render
    riskCell.innerHTML = `<span class="${riskResult.level === 'high' ? 'risk-high' : riskResult.level === 'mid' ? 'risk-mid' : 'risk-low'} fade-in">${riskResult.label}</span>`;
    aiCell.innerHTML = `<span class="ai-suggestion fade-in">${suggestion}</span>`;
    item.aiRisk = riskResult.label;
    item.aiSuggestion = suggestion;
  }
  // Show stats
  document.getElementById('stat-high').textContent = highCount;
  document.getElementById('stat-mid').textContent = midCount;
  document.getElementById('stat-low').textContent = lowCount;
  const statsBar = document.getElementById('stats-bar');
  statsBar.style.display = 'flex';
  btn.disabled = false;
  btn.textContent = '🤖 AI分析';
}

// ── Right-click context menu ──
let ctxTarget = null;
const ctxMenu = document.createElement('div');
ctxMenu.className = 'ctx-menu';
ctxMenu.innerHTML = `
  <div class="ctx-item" data-action="insert-above">⬆ 在上方插入行</div>
  <div class="ctx-item" data-action="insert-below">⬇ 在下方插入行</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" data-action="duplicate">📋 复制本行</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item danger" data-action="delete">🗑 删除本行</div>
`;
document.body.appendChild(ctxMenu);

document.addEventListener('contextmenu', function(e) {
  const tr = e.target.closest('tr[data-gi][data-ii]');
  if (!tr) { ctxMenu.classList.remove('show'); return; }
  e.preventDefault();
  ctxTarget = tr;
  ctxMenu.style.left = e.pageX + 'px';
  ctxMenu.style.top = e.pageY + 'px';
  ctxMenu.classList.add('show');
});

document.addEventListener('click', () => ctxMenu.classList.remove('show'));

ctxMenu.addEventListener('click', function(e) {
  const action = e.target.closest('.ctx-item')?.dataset.action;
  if (!action || !ctxTarget) return;
  const gi = parseInt(ctxTarget.dataset.gi);
  const ii = parseInt(ctxTarget.dataset.ii);
  const group = DATA[gi];
  const emptyItem = {name:'',time:'',owner:'',progress:'',eta:'',risk:'',conclusion:'',aiRisk:'',aiSuggestion:''};

  if (action === 'insert-above') {
    group.items.splice(ii, 0, {...emptyItem, name:'新需求'});
  } else if (action === 'insert-below') {
    group.items.splice(ii + 1, 0, {...emptyItem, name:'新需求'});
  } else if (action === 'duplicate') {
    group.items.splice(ii + 1, 0, {...group.items[ii]});
  } else if (action === 'delete') {
    if (confirm('确认删除「' + (group.items[ii].name || '该行') + '」？')) {
      group.items.splice(ii, 1);
    } else return;
  }
  saveData();
  renderTable();
  ctxMenu.classList.remove('show');
});

// ── Add column ──
function addCustomColumn() {
  const name = prompt('输入新列名：');
  if (!name) return;
  // Add to header
  const thead = document.querySelector('thead tr');
  const th = document.createElement('th');
  th.textContent = name;
  th.style.minWidth = '150px';
  thead.appendChild(th);
  // Add cells to all rows
  document.querySelectorAll('#tracker-body tr:not(.group-row)').forEach(tr => {
    const td = document.createElement('td');
    td.className = 'editable';
    td.innerHTML = '<div class="edit-marker"></div>';
    td.addEventListener('dblclick', function() {
      const input = document.createElement('input');
      input.value = this.textContent;
      this.textContent = '';
      this.appendChild(input);
      input.focus();
      const save = () => { this.textContent = input.value; this.classList.add('modified'); this.innerHTML = '<div class="edit-marker"></div>' + input.value; };
      input.addEventListener('blur', save);
      input.addEventListener('keydown', e => { if(e.key==='Enter') save(); });
    });
    tr.appendChild(td);
  });
  // Update group rows colspan
  document.querySelectorAll('.group-row td').forEach(td => {
    td.colSpan = thead.children.length;
  });
}

// Add "+" button to header
const addColBtn = document.createElement('th');
addColBtn.innerHTML = '<button class="add-col-btn" onclick="addCustomColumn()">+ 添加列</button>';
addColBtn.style.background = '#ffc73a';
document.querySelector('thead tr').appendChild(addColBtn);

// Init
loadSaved();
renderTable();
</script>
