<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>一方应用体验赛道 · 从买手机到用久了，2027 年每个阶段要做好的事</title>
<style>
  :root {
    --blue: #3A63D8;
    --ink: #1B2233;
    --ink-2: #333C50;
    --ink-3: #7A8396;
    --block: #F1F5FE;
    --rule: #DCE4F8;
    --arrow: #A7B8E4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #ECEEF2; }
  body { font-family: "MiSans", "PingFang SC", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #page { width: 1600px; margin: 0 auto; background: #fff; padding: 72px 88px 76px; }

  .eyebrow { font-size: 19px; font-weight: 500; color: var(--blue); letter-spacing: .06em; }
  h1 { font-size: 46px; line-height: 1.25; font-weight: 600; margin-top: 14px; }

  /* 四个阶段：同样的色块、同样的结构，中间用箭头连成时间顺序 */
  .flow { display: grid; grid-template-columns: minmax(0, 1fr) 44px minmax(0, 1fr) 44px minmax(0, 1.5fr) 44px minmax(0, 1fr); margin-top: 64px; }
  .blk { background: var(--block); border-radius: 20px; padding: 30px 26px 32px; }
  .when { font-size: 18px; font-weight: 600; color: var(--blue); letter-spacing: .06em; }
  .what { font-size: 26px; font-weight: 600; margin-top: 10px; white-space: nowrap; }
  .blk ul { list-style: none; margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--rule); }
  .blk li { font-size: 21px; line-height: 1.5; color: var(--ink-2); padding-left: 18px; position: relative; margin-top: 12px; white-space: nowrap; }
  .blk li:first-child { margin-top: 0; }
  .blk li::before { content: ""; position: absolute; left: 1px; top: .66em; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
  .arr { position: relative; }
  .arr::before { content: ""; position: absolute; left: 50%; top: 84px; width: 12px; height: 12px; border-top: 2.5px solid var(--arrow); border-right: 2.5px solid var(--arrow); transform: translate(-70%, 0) rotate(45deg); }
</style>
</head>
<body>
<div id="page">
  <div class="eyebrow">一方应用体验赛道</div>
  <h1>从买手机到用久了，2027 年每个阶段要做好的事</h1>

  <div class="flow">
    <div class="blk">
      <div class="when">买之前</div>
      <div class="what">门店试机</div>
      <ul>
        <li>演示内容及时更新</li>
        <li>试机流畅不卡</li>
        <li>顾客能自己上手试卖点</li>
      </ul>
    </div>
    <div class="arr"></div>
    <div class="blk">
      <div class="when">拿到新机</div>
      <div class="what">开箱、换机</div>
      <ul>
        <li>旧手机数据完整搬过来</li>
        <li>从鸿蒙手机也能换机</li>
        <li>开机引导步骤更少</li>
      </ul>
    </div>
    <div class="arr"></div>
    <div class="blk">
      <div class="when">每天用</div>
      <div class="what">闹钟、日程、出行、电话、设置</div>
      <ul>
        <li>闹钟准时，车票、酒店自动进日历</li>
        <li>陌生来电看得清，通话要点自动整理</li>
        <li>想改的设置一次找到</li>
      </ul>
    </div>
    <div class="arr"></div>
    <div class="blk">
      <div class="when">用久了</div>
      <div class="what">系统更新</div>
      <ul>
        <li>用一两年也流畅</li>
        <li>中低端机同样流畅</li>
        <li>升级时直接介绍新功能</li>
      </ul>
    </div>
  </div>
</div>
</body>
</html>
