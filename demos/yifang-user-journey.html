<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>一方应用体验赛道 · 2027 年一页图</title>
<style>
  :root {
    --blue: #3A63D8;
    --blue-mute: #9DB0DE;
    --rail: #D3DCEF;
    --ink: #1B2233;
    --ink-2: #3E475B;
    --ink-3: #7A8396;
    --zone: #F3F6FD;
    --gap: 40px;
    --cols: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 2.4fr) minmax(0, 1fr);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #ECEEF2; }
  body { font-family: "MiSans", "PingFang SC", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #page { width: 1600px; margin: 0 auto; background: #fff; padding: 72px 88px 68px; }

  .eyebrow { font-size: 19px; font-weight: 500; color: var(--blue); letter-spacing: .06em; }
  h1 { font-size: 50px; line-height: 1.25; font-weight: 600; margin-top: 14px; }

  /* 一张图：时间轴 + 每天用的重点 + 贯穿全程的要求 */
  .map { display: grid; grid-template-columns: var(--cols); grid-template-rows: auto 48px auto auto 78px auto; column-gap: var(--gap); margin-top: 92px; position: relative; }
  .zone { grid-column: 3; grid-row: 1 / 5; background: var(--zone); border-radius: 22px; margin: -32px -22px -32px -22px; }
  .st { grid-row: 1; position: relative; display: flex; align-items: baseline; gap: 12px; white-space: nowrap; }
  .st .t { font-size: 27px; font-weight: 600; color: var(--blue); }
  .st .n { font-size: 18px; color: var(--ink-3); }
  .st .end { margin-left: auto; font-size: 18px; color: var(--ink-3); }
  .st .end b { color: var(--blue-mute); margin-right: 4px; font-weight: 600; }

  .line { grid-column: 1 / -1; grid-row: 2; position: relative; }
  .line::before { content: ""; position: absolute; left: 0; right: 12px; top: 23px; height: 2px; background: var(--rail); }
  .line::after { content: ""; position: absolute; right: 0; top: 18px; border-left: 12px solid var(--rail); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
  .seg { grid-row: 2; position: relative; }
  .seg::before { content: ""; position: absolute; left: 0; top: 16px; width: 16px; height: 16px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 5px #fff; z-index: 2; }
  .seg.main::after { content: ""; position: absolute; left: 0; right: calc(-1 * var(--gap)); top: 22px; height: 4px; border-radius: 2px; background: var(--blue); z-index: 1; }
  .seg.main::before { box-shadow: 0 0 0 5px var(--zone); }

  .ac { grid-row: 3; font-size: 27px; font-weight: 500; line-height: 1.4; white-space: nowrap; }

  .focus { grid-column: 3; grid-row: 4; margin-top: 28px; }
  .focus li { list-style: none; font-size: 24px; line-height: 1.5; color: var(--ink-2); padding-left: 20px; position: relative; margin-top: 12px; white-space: nowrap; }
  .focus li:first-child { margin-top: 0; }
  .focus li::before { content: ""; position: absolute; left: 1px; top: .64em; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); }

  /* 贯穿四个阶段 */
  .bracket { grid-column: 1 / -1; grid-row: 5; position: relative; }
  .bracket::before { content: ""; position: absolute; left: 0; right: 0; top: 56px; height: 14px; border: 2px solid var(--rail); border-top: none; border-radius: 0 0 8px 8px; }
  .base { grid-column: 1 / -1; grid-row: 6; text-align: center; margin-top: 18px; font-size: 24px; color: var(--ink-2); }
  .base b { font-weight: 600; color: var(--ink); margin-right: 8px; }
</style>
</head>
<body>
<div id="page">
  <div class="eyebrow">一方应用体验赛道 · 2027 年</div>
  <h1>每个阶段都不出错，重点做好用户每天用的那几件事</h1>

  <div class="map">
    <div class="zone"></div>

    <div class="st" style="grid-column:1"><span class="t">买之前</span></div>
    <div class="st" style="grid-column:2"><span class="t">拿到新机</span></div>
    <div class="st" style="grid-column:3"><span class="t">每天用</span><span class="n">用户大部分时间在这里</span></div>
    <div class="st" style="grid-column:4"><span class="t">用久了</span><span class="end"><b>↻</b>下一台</span></div>

    <div class="line"></div>
    <div class="seg" style="grid-column:1"></div>
    <div class="seg" style="grid-column:2"></div>
    <div class="seg main" style="grid-column:3"></div>
    <div class="seg" style="grid-column:4"></div>

    <div class="ac" style="grid-column:1">门店试机</div>
    <div class="ac" style="grid-column:2">开箱、换机</div>
    <div class="ac" style="grid-column:3">闹钟、日程、出行、电话、设置</div>
    <div class="ac" style="grid-column:4">系统更新</div>

    <ul class="focus">
      <li>想改的设置一次找到，接电话少被骚扰</li>
      <li>订好的车票、酒店自动进日历，到点提醒</li>
    </ul>

    <div class="bracket"></div>
    <div class="base"><b>每个阶段都不出错</b>不卡顿、不闪退、不丢数据，中低端机同样流畅</div>
  </div>
</div>
</body>
</html>
