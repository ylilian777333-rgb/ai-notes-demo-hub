<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>今日安排 · 场景 AI App 落地页（OS5）</title>
<link rel="stylesheet" href="../os5-kit/os5.css">
</head>
<body>
<script src="../os5-kit/scenes.js"></script>
<script src="../os5-kit/cards.js"></script>
<script>
/* 李楠「一天内近期的事情安排」：早晨 / 上午 / 下午 / 晚上。数据：日历、挂号短信、订位短信、快递短信、笔记 */
var DAY=[{d:'5月15日 · 周五',rows:[['08:30','🚇','出门上班 · 地铁 10 号线','日历'],['10:00','💼','产品评审会 · 会议室 A302','日历'],['15:00','🏫','接孩子放学 · 阳光小学东门','日历'],
  ['16:30','🦷','牙医复诊 · 市口腔医院 3 楼','挂号短信'],['19:00','🍲','和小敏吃饭 · 比目鱼火锅','订位短信']]}];
var ST={0:{'0-0':'now'},1:{'0-0':'done','0-1':'now'},2:{'0-0':'done','0-1':'done','0-2':'now'},3:{'0-0':'done','0-1':'done','0-2':'done','0-3':'done','0-4':'now'}};
var TODO=[['带医保卡（16:30 牙医复诊）',[2,3]],['带评审资料 U 盘（10:00 评审）',[1,2,3]],['菜鸟驿站取 2 个快递',[]],['回家顺路买牛奶和鸡蛋',[]]];
window.OS5_PAGE={scene:'today',title:'今日安排',chip:'5月15日 周五',secC:true,
  hero:{grad:'linear-gradient(180deg,#8cb6ff 0%,rgba(233,242,239,0) 93.79%)',illus:'illus-today.webp'},
  blocks:{
    sched:{t:'今日日程',em:'📅',h:function(i){ return OS5L.plan(DAY,ST[i]); }},
    todo:{t:'别忘了',em:'📌',h:function(i){ return OS5L.todo(TODO.map(function(x){ return {t:x[0],done:x[1].indexOf(i)>=0}; })); }},
    parcel:{t:'顺路取件',em:'📦',rt:'菜鸟驿站 22:00 关门',h:function(){ return OS5L.list([
      {em:'📦',bg:'#fff3e3',t:'顺丰 · 李宁运动鞋',p:'取件码 8-2-3056 · 地铁 B 口出来 80 米',btn:{t:'复制',toast:'已复制取件码 8-2-3056 ✓'}},
      {em:'📦',bg:'#fff3e3',t:'京东 · 猫砂 20kg × 2',p:'取件码 5-1-1088 · 比较重，可以叫跑腿送上楼',btn:{t:'跑腿',toast:'已下单跑腿代取，约 15 分钟到驿站 🛵'}}])
      +'<div class="src" style="margin:8px 4px 0">来自快递短信，不用单独装一个快递 App</div>'; }},
    weather:{t:'今日天气',em:'🌦️',h:function(i){ return i<3?OS5L.weather({city:'北京 · 朝阳',temp:'19°',icon:'⛅',desc:'多云 · 傍晚阵雨',range:'26° / 17°',hours:[['现在','⛅','19°'],['12:00','☀️','24°'],['15:00','⛅','26°'],['18:00','🌧️','22°'],['21:00','🌧️','19°']]})
      :OS5L.weather({city:'北京 · 朝阳',temp:'21°',icon:'🌧️',desc:'小雨 · 出门带伞',range:'26° / 17°',hours:[['现在','🌧️','21°'],['19:00','🌧️','20°'],['20:00','🌧️','19°'],['21:00','☁️','19°'],['22:00','☁️','18°']]}); }}
  },
  order:[['top','sched','weather','todo'],['top','sched','todo','weather'],['top','sched','todo','parcel'],['top','todo','parcel','sched','weather']]
};
window.OS5_ACTIONS=[[/查看评审资料/,'sheet:docs'],[/查看详情/,'sheet:route']];
window.OS5_SHEETS={
  docs:{t:'评审资料',h:'<div class="k-card"><div class="k-kv"><span class="k">📄 评审材料 v3.pptx</span><span class="v">已备好</span></div><div class="k-kv"><span class="k">📄 会议纪要模板</span><span class="v">会后一键生成</span></div><div class="k-kv"><span class="k">👥 参会人</span><span class="v">6 人 · 会议室 A302</span></div></div><div class="k-note">来自日历邀请附件和你的笔记</div>',a:['发给参会人','全部打开'],at:['已发给 6 位参会人 💬','已打开评审资料']},
  route:{t:'公司 → 阳光小学东门',h:'<div class="k-map"></div><div class="k-card"><p>8.2 公里，打车约 18 分钟，14:40 出发 15:00 前能到。接完孩子直接去市口腔医院，16:30 复诊来得及。</p></div>',a:['换一条','立即叫车'],at:['已为你换一条路线','已为你叫车，预计 3 分钟到达 🚕']}
};
window.OS5_CHAT={'今天还有哪些事没做':'还有：15:00 接孩子、16:30 牙医复诊（带医保卡）、19:00 和小敏吃饭；回家路上顺路取 2 个快递、买牛奶和鸡蛋。','晚上聚餐要带什么':'傍晚有阵雨，记得带伞。比目鱼火锅已订 4 人卡座，18:20 出发打车约 25 分钟。'};
</script>
<script src="../os5-kit/landing.js"></script>
<script src="../os5-kit/interaction.js"></script>
</body>
</html>
