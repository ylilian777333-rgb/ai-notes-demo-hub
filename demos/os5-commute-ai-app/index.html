<script>

window.OS5_PAGE={scene:'commute',title:'上下班通勤',t32:true,chip:'工作日 · 家 ⇄ 公司',chipAt:{0:'今天上班 · 家 → 公司',1:'今天下班 · 公司 → 家'},secC:true,
  hero:{grad:'linear-gradient(180deg,#7fc6f2 0%,rgba(233,242,239,0) 93.79%)',illus:'illus-commute.webp'},
  blocks:{
    routes:{t:'推荐路线',em:'🚇',rt:'按实时路况',h:function(i){ return i===0?OS5L.list([
        {em:'🚇',bg:'#eef4ff',t:'地铁 10 号线 · 38 分钟',p:'不受限行影响 · 早高峰车厢较挤',r:'推荐',rc:'b'},
        {em:'🚕',bg:'#f4f5f8',t:'打车 · 约 58 分钟',p:'约 ¥62 · 三环拥堵',r:'¥62'},
        {em:'🚗',bg:'#fff1ee',t:'自驾 · 尾号 4 今日限行',p:'已从推荐里排除',r:'限行',rc:'r'}])

        {em:'🚇',bg:'#eef4ff',t:'地铁 10 号线 · 42 分钟',p:'比打车快 8 分钟 · 出 B 口就是菜鸟驿站',r:'推荐',rc:'b'},

    remind:{t:'路上提醒',em:'⚠️',h:function(){ return OS5L.list([
        {em:'🚫',bg:'#fff1ee',t:'今天尾号 4 限行',p:'你的车今天限行，早晚都优先地铁'},
        {em:'☔',bg:'#eef4ff',t:'傍晚有阵雨 · 18:00 后 70%',p:'出门带把伞，下班路上可能会下'}]); }},
    first:{t:'到公司先做',em:'💼',h:function(){ return OS5L.list([
        {em:'💼',bg:'#f1eeff',t:'10:00 产品评审会',p:'会议室 A302 · 评审材料 v3 已备好',src:'来自日历',btn:{t:'看资料'}}]); }},
    errands:{t:'顺路办',em:'🧺',rt:'都在回家路上',h:function(){ return OS5L.list([

window.OS5_SHEETS={

};
