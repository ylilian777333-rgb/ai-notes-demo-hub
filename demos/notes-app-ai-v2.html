<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小米笔记 · AI（OS4 发布会）</title>
<style>
:root{
  --ink:#f6f7f8; --muted:#9aa0ad; --brand:#aeb4ff;
  --line:#2a2d36; --card:#0e0f14;
  --u:min(1vw, 1.7778vh); /* Keynote 16:9：slide 高恒为 56.25u */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--ink);
  font-family:"MiSans","PingFang SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}
.stage{height:100vh;display:flex;align-items:center;justify-content:center;background:#000}
.deck{width:min(100vw,177.78vh);height:min(56.25vw,100vh);position:relative;overflow:hidden;
  scroll-snap-type:y mandatory;overflow-y:auto;scroll-behavior:smooth}
.slide{width:100%;height:100%;scroll-snap-align:start;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 50% -10%,#101119 0%,#050506 60%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(var(--u)*4.5) calc(var(--u)*6)}
.title{font-size:calc(var(--u)*3.2);font-weight:760;letter-spacing:-.01em;text-align:center;line-height:1.2;flex:0 0 auto}
.title b{color:var(--brand);font-weight:760}
.frames{display:flex;align-items:flex-start;justify-content:center;gap:calc(var(--u)*3);margin-top:calc(var(--u)*3.4)}
.frame{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.4)}
.ph{height:calc(var(--u)*33);aspect-ratio:9/19.5;border:2px dashed #3a3d47;border-radius:calc(var(--u)*2.2);
  background:linear-gradient(180deg,#13141b,#0b0c11);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:calc(var(--u)*1.2);color:#5b606d;position:relative}
.ph .cam{width:calc(var(--u)*.8);height:calc(var(--u)*.8);border-radius:50%;background:#23262f;
  position:absolute;top:calc(var(--u)*1.4);left:50%;transform:translateX(-50%)}
.ph .ico{font-size:calc(var(--u)*3);opacity:.5}
.ph .tag{font-size:calc(var(--u)*1);letter-spacing:.14em;color:#6b7080;font-weight:700}
.cap{font-size:calc(var(--u)*1.4);color:#c5c9d3;font-weight:560;text-align:center}
.brand{position:absolute;left:calc(var(--u)*4);bottom:calc(var(--u)*3);color:#767a85;font-size:calc(var(--u)*1.1);letter-spacing:.06em}
.pager{position:absolute;right:calc(var(--u)*4);bottom:calc(var(--u)*3);color:#676b75;font-size:calc(var(--u)*1.2);letter-spacing:.12em}
.nav{position:fixed;right:1.2vw;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:9px}
.dot{width:8px;height:8px;border-radius:50%;background:#555;border:0;cursor:pointer;transition:.25s;padding:0}
.dot.on{height:24px;border-radius:8px;background:var(--brand)}
.hint{position:fixed;left:50%;bottom:1vh;transform:translateX(-50%);z-index:20;color:#5c606a;font-size:calc(var(--u)*1);letter-spacing:.08em}
</style>
</head>
<body>
<div class="stage">
<div class="deck" id="deck">

  <!-- 1 · 开会：录 + 标记 -->
  <section class="slide" data-title="开会记">
    <div class="title">开会时，<b>边录边记、随手标记</b></div>
    <div class="frames">
      <div class="frame"><div class="ph"><span class="cam"></span><span class="ico">🎙️</span><span class="tag">真机截图 · 待替换</span></div>
        <div class="cap">一键录音，同时手记要点</div></div>
      <div class="frame"><div class="ph"><span class="cam"></span><span class="ico">🔖</span><span class="tag">真机截图 · 待替换</span></div>
        <div class="cap">重点随手标记，可拍照插图</div></div>
    </div>
    <div class="brand">XIAOMI NOTES · AI</div><div class="pager">01 / 03</div>
  </section>

  <!-- 2 · 散会后：录完转写 + AI 纪要待办 -->
  <section class="slide" data-title="散会理">
    <div class="title">散会后，<b>录音转成文字，AI 理成纪要</b></div>
    <div class="frames">
      <div class="frame"><div class="ph"><span class="cam"></span><span class="ico">📝</span><span class="tag">真机截图 · 待替换</span></div>
        <div class="cap">录完自动转写，原文可回看</div></div>
      <div class="frame"><div class="ph"><span class="cam"></span><span class="ico">📋</span><span class="tag">真机截图 · 待替换</span></div>
        <div class="cap">AI 出纪要，待办进日程</div></div>
    </div>
    <div class="brand">XIAOMI NOTES · AI</div><div class="pager">02 / 03</div>
  </section>

  <!-- 3 · 过几天：问一句带出处 -->
  <section class="slide" data-title="过几天调">
    <div class="title">过几天想不起来，<b>问一句就答</b></div>
    <div class="frames">
      <div class="frame"><div class="ph"><span class="cam"></span><span class="ico">🔍</span><span class="tag">真机截图 · 待替换</span></div>
        <div class="cap">按意思从全部笔记找回</div></div>
      <div class="frame"><div class="ph"><span class="cam"></span><span class="ico">💡</span><span class="tag">真机截图 · 待替换</span></div>
        <div class="cap">答案带原文出处</div></div>
    </div>
    <div class="brand">XIAOMI NOTES · AI</div><div class="pager">03 / 03</div>
  </section>

</div>
</div>

<nav class="nav" id="nav"></nav>
<div class="hint">← → / SPACE 翻页</div>

<script>
const deck=document.getElementById('deck');
const nav=document.getElementById('nav');
const slides=[...deck.querySelectorAll('.slide')];
let current=0;
slides.forEach((s,i)=>{
  const b=document.createElement('button');
  b.className='dot'+(i===0?' on':'');
  b.title=s.dataset.title||('第 '+(i+1)+' 页');
  b.onclick=()=>go(i);
  nav.appendChild(b);
});
const dots=()=>[...nav.children];
function go(i){
  current=Math.max(0,Math.min(slides.length-1,i));
  slides[current].scrollIntoView({behavior:'smooth'});
  dots().forEach((d,n)=>d.classList.toggle('on',n===current));
}
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){current=slides.indexOf(e.target);
    dots().forEach((d,n)=>d.classList.toggle('on',n===current))}
}),{root:deck,threshold:.6});
slides.forEach(s=>io.observe(s));
addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}
  if(e.key==='Home')go(0);
  if(e.key==='End')go(slides.length-1);
});
</script>
</body>
</html>
