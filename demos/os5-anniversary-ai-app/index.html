<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>生日纪念 · 场景 AI App 落地页（OS5）</title>
<link rel="stylesheet" href="../os5-kit/os5.css">
</head>
<body>
<script src="../os5-kit/scenes.js"></script>
<script src="../os5-kit/cards.js"></script>
<script>
/* 数据：日历（生日）、你的笔记（礼物想法、去年送的礼物）、订单（蛋糕/餐厅）。提前一周 → 前两天 → 当天 */
var PREP=[['订一个 8 寸生日蛋糕',[2]],['预订家庭聚餐餐厅',[1,2]],['买生日礼物（羊绒围巾）',[2]],['准备红包和一束康乃馨',[2]],['约弟弟一家视频连线',[2]]];
window.OS5_PAGE={scene:'bday',title:'生日纪念',chip:'5月17日 周日 · 妈妈 60 岁',secC:true,
  hero:{grad:'linear-gradient(180deg,#ffa8c0 0%,rgba(233,242,239,0) 93.79%)',illus:'illus-anniversary.webp'},
  blocks:{
    gifts:{t:'礼物灵感',em:'🎁',rt:'预算 ¥800 · 来自你的笔记',h:function(){ return OS5L.list([
        {em:'🧣',bg:'#fff1ee',t:'羊绒围巾 · ¥680',p:'妈妈说冬天脖子怕冷；去年的按摩仪她很喜欢',r:'推荐',rc:'b'},
        {em:'⌚',bg:'#eef4ff',t:'智能手环 · ¥299',p:'能看心率、提醒吃药，配合她的降压药'},
        {em:'🩺',bg:'#eefaf3',t:'年度体检套餐 · ¥799',p:'60 岁后每年一次，可以预约周末'}]); }},
    prep:{t:'准备清单',em:'☑️',h:function(i){ return OS5L.todo(PREP.map(function(x){ return {t:x[0],done:x[1].indexOf(i)>=0}; })); }},
    day:{t:'当天安排',em:'🗓️',h:function(i){ return OS5L.plan([{d:'5月17日 · 周日',rows:[['08:30','💌','给妈妈发生日祝福'],['12:00','📹','和弟弟一家视频连线'],['17:30','🎂','取蛋糕 · 好利来（订单已付）'],['18:30','🍽️','家庭聚餐 · 老家 6 人桌']]}],
        i===2?{'0-0':'now'}:{}); }},
    wish:{t:'生日祝福草稿',em:'💌',h:function(){ return '<div class="card"><p style="font-size:15px;line-height:24px;color:rgba(0,0,0,.85)">妈，60 岁生日快乐！谢谢你这么多年一直照顾我们。今年给你挑了条围巾，冬天出门别再冻着。晚上回家吃饭，爱你 ❤️</p>'
        +'<div class="fbtns"><button class="fb">改一改</button><button class="fb pri" data-toast="已发送给妈妈 💬">发给妈妈</button></div></div>'; }}
  },
  order:[['top','gifts','prep'],['top','gifts','day'],['top','day','wish']]
};
window.OS5_ACTIONS=[[/看看礼物/,'sheet:gifts'],[/^看看$/,'sheet:wish'],[/改一改/,'好的，改完再发']];
window.OS5_SHEETS={
  gifts:{t:'礼物灵感',h:'<div class="k-card"><div class="k-kv"><span class="k">🧣 羊绒围巾</span><span class="v">¥680 · 推荐</span></div><div class="k-kv"><span class="k">⌚ 智能手环</span><span class="v">¥299</span></div><div class="k-kv"><span class="k">🩺 年度体检套餐</span><span class="v">¥799</span></div></div><div class="k-note">来自你的笔记：「妈冬天怕冷」「去年送按摩仪她很喜欢」</div>',a:['再想想','加入购物车'],at:['好的','已加入购物车 🛒']},
  wish:{t:'生日祝福草稿',h:'<div class="k-card"><p>妈，60 岁生日快乐！谢谢你这么多年一直照顾我们。今年给你挑了条围巾，冬天出门别再冻着。晚上回家吃饭，爱你 ❤️</p></div>',a:['改一改','发给妈妈'],at:['好的','已发送给妈妈 💬']}
};
window.OS5_CHAT={'送妈妈什么礼物好':'按你笔记里的想法，推荐羊绒围巾（¥680），妈妈冬天怕冷；也可以加一个智能手环提醒她吃药。','生日当天怎么安排':'08:30 发祝福，12:00 和弟弟一家视频，17:30 取蛋糕，18:30 家庭聚餐。'};
</script>
<script src="../os5-kit/landing.js"></script>
<script src="../os5-kit/interaction.js"></script>
</body>
</html>
