<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>一方应用体验赛道 · 2027 年做好三件事</title>
<style>
  body { margin: 0; background: #ECEEF2; }
  #pyr { display: block; margin: 24px auto; background: #fff; }
  text { font-family: "MiSans", "PingFang SC", sans-serif; }
</style>
</head>
<body>
<svg id="pyr" width="1600" height="860" viewBox="0 0 1600 860" xmlns="http://www.w3.org/2000/svg">
  <text x="120" y="96" font-size="36" font-weight="700" fill="#1F2A44">2027 年做好三件事</text>
  <text x="120" y="140" font-size="19" fill="#6B778F">一方应用体验赛道 · 让用户每天要做的事顺畅、可靠、少打扰，手机提前把要用的信息准备好</text>

  <!-- 金字塔：自上而下 AI 竞争力 / 满意度 / 基础体验 -->
  <g stroke="#9DB3DD" stroke-width="1.5">
    <polygon points="400,222 540,222 630,392 310,392" fill="#EEF3FC"/>
    <polygon points="306,400 634,400 724,570 216,570" fill="#E1EAF9"/>
    <polygon points="212,578 728,578 818,748 122,748" fill="#D3E0F7"/>
  </g>
  <g text-anchor="middle">
    <text x="470" y="316" font-size="30" font-weight="700" fill="#1F2A44">AI 竞争力</text>
    <text x="470" y="354" font-size="20" fill="#3D4A66">做增量</text>
    <text x="470" y="494" font-size="30" font-weight="700" fill="#1F2A44">满意度</text>
    <text x="470" y="532" font-size="20" fill="#3D4A66">补短板</text>
    <text x="470" y="672" font-size="30" font-weight="700" fill="#1F2A44">基础体验</text>
    <text x="470" y="710" font-size="20" fill="#3D4A66">守底线</text>
  </g>

  <!-- 引线 -->
  <g stroke="#9DB3DD" stroke-width="1.5">
    <line x1="590" y1="318" x2="900" y2="318"/>
    <line x1="684" y1="496" x2="900" y2="496"/>
    <line x1="778" y1="674" x2="900" y2="674"/>
  </g>
  <g fill="#7F98C9"><circle cx="900" cy="318" r="4"/><circle cx="900" cy="496" r="4"/><circle cx="900" cy="674" r="4"/></g>

  <!-- 每层一句话 -->
  <g font-size="23" fill="#1F2A44">
    <text x="926" y="326">三个 Agent 上线，一方应用接入超级小爱</text>
    <text x="926" y="504">系统设置、电话、日历满意度各提升 4 个百分点</text>
    <text x="926" y="682">三个子赛道基础体验全部交付，中低端机同样流畅</text>
  </g>

  <line x1="120" y1="782" x2="1480" y2="782" stroke="#C5CEDD" stroke-width="1.5"/>
  <text x="120" y="818" font-size="17" fill="#6B778F">四个子赛道：日程出行 · 通讯 · 设备管理 · 门店演示</text>
</svg>
</body>
</html>
