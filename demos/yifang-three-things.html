<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>一方应用体验赛道 · 2027 年做好三件事</title>
<style>
  body { margin: 0; background: #ECEEF2; }
  #pyr { display: block; margin: 24px auto; background: #fff; }
  text { font-family: "MiSans", "PingFang SC", sans-serif; }
</style>
</head>
<body>
<svg id="pyr" width="1600" height="880" viewBox="0 0 1600 880" xmlns="http://www.w3.org/2000/svg">
  <!-- 标题 -->
  <text x="120" y="96" font-size="34" font-weight="700" fill="#1F2A44">2027 年做好三件事：先可靠，再省心，再主动</text>
  <text x="120" y="138" font-size="19" fill="#6B778F">一方应用体验赛道 · 目标：让用户每天要做的事顺畅、可靠、少打扰，手机提前把要用的信息准备好</text>

  <!-- 金字塔：中心 x=470，自上而下 主动 / 省心 / 可靠 -->
  <g stroke="#9DB3DD" stroke-width="1.5">
    <polygon points="400,232 540,232 630,402 310,402" fill="#EEF3FC"/>
    <polygon points="306,410 634,410 724,580 216,580" fill="#E1EAF9"/>
    <polygon points="212,588 728,588 818,758 122,758" fill="#D3E0F7"/>
  </g>
  <g text-anchor="middle" fill="#1F2A44">
    <text x="470" y="312" font-size="32" font-weight="700">主动</text>
    <text x="470" y="352" font-size="18" fill="#3D4A66">提前把要用的信息准备好</text>
    <text x="470" y="490" font-size="32" font-weight="700">省心</text>
    <text x="470" y="530" font-size="18" fill="#3D4A66">好找、少打扰</text>
    <text x="470" y="668" font-size="32" font-weight="700">可靠</text>
    <text x="470" y="708" font-size="18" fill="#3D4A66">每天用的功能不出错</text>
  </g>

  <!-- 引线 -->
  <g stroke="#9DB3DD" stroke-width="1.5" fill="none">
    <line x1="585" y1="317" x2="900" y2="317"/>
    <line x1="679" y1="495" x2="900" y2="495"/>
    <line x1="773" y1="673" x2="900" y2="673"/>
  </g>
  <g fill="#7F98C9">
    <circle cx="900" cy="317" r="4"/><circle cx="900" cy="495" r="4"/><circle cx="900" cy="673" r="4"/>
  </g>

  <!-- 右侧：2027 年做到 -->
  <g fill="#1F2A44" font-size="20">
    <text x="926" y="290" font-size="15" fill="#6B778F">对应 AI 竞争力</text>
    <text x="926" y="324">日程出行 Agent、设置 AI 搜索在 OS5.0 上线</text>
    <text x="926" y="356">端侧通话摘要、黄页反查在 OS5.0.1 上线</text>

    <text x="926" y="468" font-size="15" fill="#6B778F">对应 NSS</text>
    <text x="926" y="502">设置搜索一次成功率 24.9% → 45%</text>
    <text x="926" y="534">系统设置、电话、日历满意度各提升 4 个百分点</text>

    <text x="926" y="646" font-size="15" fill="#6B778F">对应基础体验</text>
    <text x="926" y="680">闹钟响铃率 99.5%，高负载 ANR 清零</text>
    <text x="926" y="712">换机数据接入率 90%，演示机 24 小时升级率 ≥99%</text>
  </g>

  <!-- 底线 -->
  <line x1="120" y1="790" x2="1480" y2="790" stroke="#C5CEDD" stroke-width="1.5"/>
  <text x="120" y="826" font-size="17" fill="#6B778F">四个子赛道：日程出行 · 通讯 · 设备管理 · 门店演示</text>
</svg>
</body>
</html>
