<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>健康用药 · 场景 AI App 落地页（OS5）</title>
<link rel="stylesheet" href="../os5-kit/os5.css">
</head>
<body>
<script src="../os5-kit/scenes.js"></script>
<script src="../os5-kit/cards.js"></script>
<script>
/* 数据：你拍的处方、妈妈的用药打卡、米家血压计、购药订单、复诊挂号短信 */
var DOSE=[{d:'5月15日 · 周五',rows:[['08:00','💊','氨氯地平 1 片 · 早餐后'],['12:30','💊','氨氯地平 + 二甲双胍 · 午饭后'],['18:00','💊','二甲双胍 1 片 · 晚饭后'],['21:00','💊','钙片 + 维生素 D · 睡前']]}];
var DST={0:{'0-0':'now'},1:{'0-0':'done','0-1':'now'},2:{'0-0':'done','0-1':'done','0-2':'done','0-3':'now'}};
window.OS5_PAGE={scene:'health',title:'健康用药',chip:'妈妈 · 每天 4 次',chipAt:{3:'5月20日 周三 · 心内科复诊'},secC:true,
  hero:{grad:'linear-gradient(180deg,#9ee0b4 0%,rgba(233,242,239,0) 93.79%)',illus:'illus-medication.webp'},
  blocks:{
    dose:{t:'今天的用药',em:'💊',rt:'妈妈打卡',h:function(i){ return OS5L.plan(DOSE,DST[i]); }},
    bp:{t:'血压记录',em:'❤️',rt:'米家血压计',h:function(){
      var d=[[128,82],[134,86],[126,80],[131,84],[125,79],[129,83],[127,81]], w=['五','六','日','一','二','三','四'];
      return '<div class="card"><div style="display:flex;align-items:flex-end;justify-content:space-between;height:96px;padding:0 4px">'+d.map(function(x,j){ var h=(x[0]-100)*2.4;
        return '<div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:rgba(0,0,0,.4)"><span style="font-size:10.5px;color:rgba(0,0,0,.6)">'+x[0]+'</span><i style="width:16px;height:'+h+'px;border-radius:8px;background:'+(x[0]>=133?'#f5533d':'#48bd79')+';opacity:.85"></i>周'+w[j]+'</div>'; }).join('')
        +'</div><div class="hr"></div><div class="kv" style="padding:2px 0"><span class="k">近 7 天平均</span><span class="v">129 / 82 mmHg · 平稳</span></div></div>'; }},
    stock:{t:'药品余量',em:'📦',rt:'按打卡自动扣减',h:function(i){ return OS5L.list([
        {em:'💊',bg:'#fff1ee',t:'氨氯地平片',p:i>=1?'剩 6 片 · 约 3 天':'剩 8 片 · 约 4 天',btn:{t:'补药',toast:'已加入购物车，确认后下单 💊'}},
        {em:'💊',bg:'#f4f5f8',t:'二甲双胍缓释片',p:'剩 22 片 · 约 11 天'},
        {em:'🦴',bg:'#f4f5f8',t:'钙片 + 维生素 D',p:'剩 40 片 · 够用'}]); }},
    visit:{t:'复诊',em:'🏥',h:function(){ return OS5L.kv([['时间','5月20日 周三 09:00'],['科室','协和医院 · 心内科'],['要带','近 3 个月血压和用药记录（已整理）']],'来自挂号短信'); }}
  },
  order:[['top','dose','bp','stock'],['top','stock','dose'],['top','dose','bp'],['top','visit','bp','stock']]
};
window.OS5_ACTIONS=[[/查看记录/,'sheet:rec'],[/提醒妈妈/,'已提醒妈妈，她的手机会响铃 🔔']];
window.OS5_SHEETS={rec:{t:'近 3 个月记录',h:'<div class="k-card"><div class="k-kv"><span class="k">血压均值</span><span class="v">129 / 82 mmHg</span></div><div class="k-kv"><span class="k">偏高天数</span><span class="v">6 天（多在周末）</span></div><div class="k-kv"><span class="k">按时服药</span><span class="v">96%</span></div></div><div class="k-note">来自米家血压计和妈妈的用药打卡</div>',a:['分享给医生','全屏查看'],at:['已复制分享链接 ✓','已全屏显示']}};
window.OS5_CHAT={'妈妈今天按时吃药了吗':'今天 08:05、12:34、18:10 都按时打卡了，还剩 21:00 的钙片和维生素 D。','血压偏高要注意什么':'近 7 天平均 129/82，比较平稳。周末偶尔偏高，提醒妈妈少吃咸、按时吃药。'};
</script>
<script src="../os5-kit/landing.js"></script>
<script src="../os5-kit/interaction.js"></script>
</body>
</html>
